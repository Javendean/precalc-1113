<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141f">
<title>Precalc 1113</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#10141f;color:#e8edf7;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:0 0 env(safe-area-inset-bottom);
  overflow-wrap:break-word;
}
#app{max-width:640px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:24px;line-height:1.25;margin:0 0 6px}
h2{font-size:19px;line-height:1.3;margin:26px 0 10px}
h3{font-size:15px;margin:18px 0 8px;color:#9fb0cc;text-transform:uppercase;letter-spacing:.06em}
p{margin:0 0 12px}
.muted{color:#8fa0bd}
.small{font-size:13.5px}
.tiny{font-size:12px}
math{font-size:1.06em}

/* ---------- cards ---------- */
.card{background:#182034;border:1px solid #26314c;border-radius:14px;padding:16px;margin:0 0 14px}
.card.tight{padding:13px}
.flag{border-left:4px solid var(--c,#3fa9f5)}

/* ---------- buttons ---------- */
button{font:inherit;color:inherit;cursor:pointer;border-radius:12px;border:1px solid #2f3b59;
  background:#1e2740;padding:13px 16px;width:100%;text-align:left;margin:0 0 9px;
  transition:background .12s,border-color .12s}
button:active{background:#26304e}
button[disabled]{opacity:.55;cursor:default}
.btn-primary{background:#2f7ff0;border-color:#2f7ff0;color:#fff;text-align:center;font-weight:600}
.btn-primary:active{background:#2569c8}
.btn-ghost{background:transparent;border-color:#33405f;text-align:center}
.row{display:flex;gap:9px}
.row>button{margin-bottom:9px}

/* ---------- options ---------- */
.opt{display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.opt .k{flex:0 0 25px;height:25px;border-radius:7px;background:#2b3550;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;color:#a9bcdc;margin-top:1px}
.opt .t{flex:1;min-width:0}
button.right{border-color:#3ecf8e;background:#16342a}
button.right .k{background:#3ecf8e;color:#08120e}
button.wrong{border-color:#f2607a;background:#341a22}
button.wrong .k{background:#f2607a;color:#2a0910}

/* ---------- confidence ---------- */
.conf{display:flex;gap:8px}
.conf button{text-align:center;padding:11px 6px;font-size:13.5px;line-height:1.35;margin:0}
.conf .e{display:block;font-size:19px;margin-bottom:3px}

/* ---------- progress ---------- */
.bar{height:7px;background:#232d47;border-radius:99px;overflow:hidden;margin:0 0 16px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f7ff0,#49d6c0);
  border-radius:99px;transition:width .35s ease}
.meter{height:6px;background:#232d47;border-radius:99px;overflow:hidden;margin:6px 0 0}
.meter>i{display:block;height:100%;border-radius:99px}

/* ---------- misc ---------- */
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:99px;
  background:#26314c;color:#a9bcdc;margin:0 6px 6px 0;white-space:nowrap}
.pill.warn{background:#4a2230;color:#ffc0cd}
.pill.good{background:#183a2e;color:#8ff0c4}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #232d47}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.steps{margin:8px 0 0;padding:0 0 0 18px}
.steps li{margin:0 0 5px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 6px;border-bottom:1px solid #232d47;text-align:left;vertical-align:top}
th{color:#8fa0bd;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
code{background:#232d47;padding:2px 6px;border-radius:6px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.q2{border:1px solid #26314c;border-radius:11px;padding:11px}
.q2 .n{font-size:23px;font-weight:700;line-height:1}
.q2 .l{font-size:11.5px;color:#8fa0bd;margin-top:3px;line-height:1.35}
.nav{position:fixed;left:0;right:0;bottom:0;background:#131a2b;border-top:1px solid #26314c;
  display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;margin:0;background:transparent;border:0;text-align:center;padding:7px 3px;
  font-size:11px;color:#8fa0bd;border-radius:9px}
.nav button.on{color:#6fb2ff;background:#1b2640}
.nav .i{display:block;font-size:17px;margin-bottom:2px}
.hidden{display:none !important}
textarea{width:100%;min-height:110px;background:#131a2b;color:#e8edf7;border:1px solid #2f3b59;
  border-radius:11px;padding:11px;font:13px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
input[type=password],input[type=text]{width:100%;background:#131a2b;color:#e8edf7;
  border:1px solid #2f3b59;border-radius:11px;padding:13px;font:inherit}
</style>
</head>
<body>
<div id="app"></div>
<div class="nav hidden" id="nav"></div>
<script>
/* =====================================================================
 * Precalc 1113 -- diagnostic + practice PWA
 *
 * One inline script, no runtime dependencies. Math arrives as MathML that
 * was rendered at build time, so there is no KaTeX, no web font and no CDN

const DATA = {"serial":1,"student":"","tutorCode":"unitcircle","synthetic":true,"kcs":[{"id":"frac_arith","name":"Fraction arithmetic","tier":0,"chapter":"prereq","prereqs":[],"anchor":false,"blurb":"Add, subtract, multiply and divide numeric fractions; find a common denominator."},{"id":"signed_numbers","name":"Signed numbers & distributing a negative","tier":0,"chapter":"prereq","prereqs":[],"anchor":false,"blurb":"Handle subtraction of a quantity: -(a - b) = -a + b."},{"id":"order_ops","name":"Order of operations & implicit grouping","tier":0,"chapter":"prereq","prereqs":[],"anchor":false,"blurb":"Read -3^2 and (-3)^2 differently; treat a fraction bar as grouping."},{"id":"exp_laws","name":"Integer exponent laws","tier":0,"chapter":"prereq","prereqs":["order_ops"],"anchor":false,"blurb":"Product, quotient and power rules for like bases."},{"id":"exp_negative","name":"Negative & zero exponents","tier":0,"chapter":"prereq","prereqs":["exp_laws","frac_arith"],"anchor":false,"blurb":"x^-n is a reciprocal, not a sign change; x^0 = 1."},{"id":"exp_rational","name":"Rational exponents & radical form","tier":0,"chapter":"prereq","prereqs":["exp_negative"],"anchor":false,"blurb":"a^(m/n) is the n-th root of a^m; convert in both directions."},{"id":"radicals","name":"Radical simplification & rationalizing","tier":0,"chapter":"prereq","prereqs":["exp_rational"],"anchor":false,"blurb":"Simplify roots, rationalize denominators, and know sqrt(a^2+b^2) is not a+b."},{"id":"distribute","name":"Distributing & expanding binomials","tier":0,"chapter":"prereq","prereqs":["signed_numbers"],"anchor":false,"blurb":"(a+b)^2 = a^2 + 2ab + b^2 -- the middle term is not optional."},{"id":"factor_gcf","name":"Factoring: greatest common factor","tier":0,"chapter":"prereq","prereqs":["distribute"],"anchor":false,"blurb":"Pull out the common factor first, always."},{"id":"factor_trinomial","name":"Factoring trinomials","tier":0,"chapter":"prereq","prereqs":["factor_gcf"],"anchor":false,"blurb":"Factor ax^2+bx+c, including the case a is not 1."},{"id":"factor_special","name":"Special factoring forms","tier":0,"chapter":"prereq","prereqs":["factor_gcf"],"anchor":false,"blurb":"Difference of squares, sum/difference of cubes, perfect-square trinomials."},{"id":"rational_expr","name":"Rational expressions & illegal cancellation","tier":0,"chapter":"prereq","prereqs":["factor_trinomial","frac_arith"],"anchor":false,"blurb":"Cancel factors, never addends: (x+3)/3 does not reduce to x."},{"id":"complex_frac","name":"Complex fractions","tier":0,"chapter":"prereq","prereqs":["rational_expr"],"anchor":false,"blurb":"Simplify a fraction whose parts are themselves fractions."},{"id":"linear_eq","name":"Solving linear equations","tier":0,"chapter":"prereq","prereqs":["distribute"],"anchor":false,"blurb":"Isolate the variable; clear denominators safely."},{"id":"quadratic_eq","name":"Solving quadratics: factoring, formula, square roots","tier":0,"chapter":"prereq","prereqs":["factor_trinomial","radicals"],"anchor":true,"blurb":"Zero-product property, the quadratic formula, and plus/minus on square roots."},{"id":"rational_eq","name":"Rational equations & extraneous solutions","tier":0,"chapter":"prereq","prereqs":["rational_expr","linear_eq"],"anchor":false,"blurb":"Clear denominators, then check every root against the original domain."},{"id":"radical_eq","name":"Radical equations & extraneous solutions","tier":0,"chapter":"prereq","prereqs":["radicals","quadratic_eq"],"anchor":false,"blurb":"Squaring both sides can invent solutions; checking is part of the method."},{"id":"inequalities","name":"Inequalities, interval notation & sign analysis","tier":0,"chapter":"prereq","prereqs":["linear_eq","factor_trinomial"],"anchor":true,"blurb":"Flip when multiplying or dividing by a negative; solve nonlinear ones by sign chart."},{"id":"absolute_value","name":"Absolute value equations & inequalities","tier":0,"chapter":"prereq","prereqs":["inequalities"],"anchor":false,"blurb":"Split into two cases; |x|<a is an AND, |x|>a is an OR."},{"id":"fn_notation","name":"Function notation & evaluation","tier":1,"chapter":"1","prereqs":["distribute","order_ops"],"anchor":true,"blurb":"f(x) is a name with an input, not multiplication; evaluate f(x+h) correctly."},{"id":"fn_domain_range","name":"Domain & range from formulas and graphs","tier":1,"chapter":"1","prereqs":["radicals","rational_expr","inequalities"],"anchor":true,"blurb":"Exclude zero denominators and negative even radicands; write in interval notation."},{"id":"fn_graph_reading","name":"Reading graphs: intercepts, increase, extrema","tier":1,"chapter":"1","prereqs":["fn_notation"],"anchor":false,"blurb":"Extract behavior and key features from a picture."},{"id":"fn_vertical_line","name":"Function vs relation; one-to-one","tier":1,"chapter":"1","prereqs":["fn_graph_reading"],"anchor":false,"blurb":"Vertical-line test for function, horizontal-line test for invertibility."},{"id":"fn_composition","name":"Composition of functions","tier":1,"chapter":"1","prereqs":["fn_notation"],"anchor":true,"blurb":"The composite f of g means f(g(x)); order matters and the domain can shrink."},{"id":"fn_inverse","name":"Inverse functions","tier":1,"chapter":"1","prereqs":["fn_composition","fn_vertical_line","linear_eq"],"anchor":true,"blurb":"The inverse undoes f; it is not the reciprocal. Swap x and y, then solve."},{"id":"fn_transformations","name":"Transformations of graphs","tier":1,"chapter":"1","prereqs":["fn_notation"],"anchor":true,"blurb":"Inside affects x and runs backwards; outside affects y and runs forwards."},{"id":"fn_piecewise","name":"Piecewise-defined functions","tier":1,"chapter":"1","prereqs":["fn_notation","inequalities"],"anchor":false,"blurb":"Pick the branch whose condition the input satisfies."},{"id":"fn_even_odd","name":"Even & odd symmetry","tier":1,"chapter":"1","prereqs":["fn_notation","signed_numbers"],"anchor":false,"blurb":"Even means f(-x)=f(x). Odd means f(-x)=-f(x)."},{"id":"fn_avg_rate","name":"Average rate of change & difference quotient","tier":1,"chapter":"1","prereqs":["fn_notation","rational_expr"],"anchor":false,"blurb":"Slope between two points; the difference quotient is the calculus on-ramp."},{"id":"linear_models","name":"Linear functions, slope & modeling","tier":1,"chapter":"2","prereqs":["linear_eq","fn_notation"],"anchor":false,"blurb":"Slope as a rate; build and interpret a linear model."},{"id":"quadratic_forms","name":"Quadratic functions: vertex form & completing the square","tier":1,"chapter":"3","prereqs":["quadratic_eq","factor_special"],"anchor":true,"blurb":"Convert to a(x-h)^2+k; read off the vertex and the max or min."},{"id":"poly_end_behavior","name":"Polynomial end behavior & degree","tier":1,"chapter":"3","prereqs":["exp_laws","fn_graph_reading"],"anchor":false,"blurb":"The leading term alone decides both tails."},{"id":"poly_zeros","name":"Zeros, multiplicity & graph shape","tier":1,"chapter":"3","prereqs":["factor_trinomial","poly_end_behavior"],"anchor":true,"blurb":"Odd multiplicity crosses; even multiplicity touches and turns."},{"id":"poly_division","name":"Polynomial & synthetic division; remainder theorem","tier":1,"chapter":"3","prereqs":["poly_zeros"],"anchor":false,"blurb":"Divide, and use the fact that f(c) equals the remainder to test roots."},{"id":"rational_asymptotes","name":"Rational functions: asymptotes & holes","tier":1,"chapter":"3","prereqs":["rational_expr","poly_end_behavior"],"anchor":true,"blurb":"Holes come from cancelled factors; end behavior comes from comparing degrees."},{"id":"exp_functions","name":"Exponential functions & growth/decay","tier":1,"chapter":"4","prereqs":["exp_negative","fn_transformations"],"anchor":true,"blurb":"Recognize growth versus decay and the horizontal asymptote."},{"id":"log_definition","name":"Logarithm as an inverse; converting forms","tier":1,"chapter":"4","prereqs":["exp_functions","fn_inverse"],"anchor":true,"blurb":"A log is an exponent. Every log question is an exponent question."},{"id":"log_properties","name":"Logarithm properties: product, quotient, power","tier":1,"chapter":"4","prereqs":["log_definition","exp_laws"],"anchor":true,"blurb":"The log of a product is a sum. There is no rule for the log of a sum."},{"id":"log_solve","name":"Solving exponential & logarithmic equations","tier":1,"chapter":"4","prereqs":["log_properties","rational_eq"],"anchor":true,"blurb":"Take a log, or exponentiate; then check the domain of every answer."},{"id":"exp_log_models","name":"Exponential & logarithmic models","tier":1,"chapter":"4","prereqs":["log_solve"],"anchor":false,"blurb":"Half-life, compound interest, continuous growth with e."},{"id":"angles_radians","name":"Angles, radian measure & arc length","tier":1,"chapter":"5","prereqs":["frac_arith"],"anchor":true,"blurb":"Convert degrees and radians fluently; arc length is r times theta."},{"id":"right_triangle_trig","name":"Right-triangle trigonometry","tier":1,"chapter":"5","prereqs":["radicals","angles_radians"],"anchor":true,"blurb":"Define the six ratios and solve for a missing side or angle."},{"id":"unit_circle","name":"Unit circle & exact values","tier":1,"chapter":"5","prereqs":["right_triangle_trig","radicals"],"anchor":true,"blurb":"The coordinates are cosine and sine; know the special angles and quadrant signs."},{"id":"trig_reference_angles","name":"Reference angles & quadrant signs","tier":1,"chapter":"5","prereqs":["unit_circle"],"anchor":false,"blurb":"Reduce any angle to an acute reference, then fix the sign by quadrant."},{"id":"trig_graphs","name":"Graphs of sine & cosine: amplitude, period, shifts","tier":1,"chapter":"6","prereqs":["unit_circle","fn_transformations"],"anchor":true,"blurb":"For a sin(b(x-c))+d the period is 2 pi over b and the amplitude is the size of a."},{"id":"trig_other_graphs","name":"Graphs of tangent, cotangent, secant, cosecant","tier":1,"chapter":"6","prereqs":["trig_graphs","rational_asymptotes"],"anchor":false,"blurb":"Asymptotes appear where the defining ratio has a zero denominator."},{"id":"inverse_trig","name":"Inverse trigonometric functions","tier":1,"chapter":"6","prereqs":["trig_graphs","fn_inverse"],"anchor":true,"blurb":"Arcsine is not the reciprocal of sine; the restricted range is the whole idea."},{"id":"trig_identities_basic","name":"Pythagorean & reciprocal identities","tier":1,"chapter":"7","prereqs":["unit_circle"],"anchor":true,"blurb":"Sine squared plus cosine squared is one, plus its two derived forms."},{"id":"trig_sum_diff","name":"Sum, difference & double-angle formulas","tier":1,"chapter":"7","prereqs":["trig_identities_basic"],"anchor":false,"blurb":"Sine does not distribute over a sum; the formula exists because of that."},{"id":"trig_simplify","name":"Simplifying & verifying identities","tier":1,"chapter":"7","prereqs":["trig_identities_basic","rational_expr"],"anchor":false,"blurb":"Work one side into the other using identities and algebra."},{"id":"trig_equations","name":"Solving trigonometric equations","tier":1,"chapter":"7","prereqs":["trig_identities_basic","quadratic_eq","trig_reference_angles"],"anchor":true,"blurb":"Find every solution in the stated interval, not only the calculator's one."},{"id":"law_sines_cosines","name":"Law of sines & law of cosines","tier":1,"chapter":"8","prereqs":["right_triangle_trig","quadratic_eq"],"anchor":true,"blurb":"Match the law to the given parts; watch the ambiguous side-side-angle case."},{"id":"vectors","name":"Vectors: components, magnitude, operations","tier":1,"chapter":"8","prereqs":["right_triangle_trig","radicals"],"anchor":false,"blurb":"Decompose into components; add componentwise."},{"id":"polar","name":"Polar coordinates & conversion","tier":1,"chapter":"8","prereqs":["unit_circle","right_triangle_trig"],"anchor":false,"blurb":"Convert between rectangular and polar in both directions."},{"id":"systems_linear","name":"Systems of linear equations","tier":1,"chapter":"9","prereqs":["linear_eq"],"anchor":false,"blurb":"Substitution and elimination; recognize the no-solution and infinite cases."},{"id":"systems_nonlinear","name":"Nonlinear systems","tier":1,"chapter":"9","prereqs":["systems_linear","quadratic_eq"],"anchor":false,"blurb":"A line and a conic can meet zero, one or two times."},{"id":"conics","name":"Conic sections: circles, parabolas, ellipses, hyperbolas","tier":1,"chapter":"10","prereqs":["quadratic_forms"],"anchor":false,"blurb":"Identify the shape from the equation; complete the square to reach standard form."},{"id":"sequences_series","name":"Sequences & series: arithmetic and geometric","tier":1,"chapter":"11","prereqs":["exp_functions","linear_models"],"anchor":false,"blurb":"A common difference is linear; a common ratio is exponential."}],"families":{"LINEARITY_ILLUSION":{"name":"Everything distributes over addition","summary":"Treats every operation as if f(a+b) = f(a) + f(b). This single belief produces errors in exponents, radicals, logarithms, trigonometry and rational expressions, which makes it look like five separate weaknesses.","fix":"Attack it once, numerically, and let the arithmetic do the arguing. (3+4)^2 = 49 but 3^2+4^2 = 25. sqrt(9+16) = 5 but 3+4 = 7. Then name the rule out loud: only multiplication distributes over addition. Return to the same counterexample every time it resurfaces in a new chapter so she sees it is one bug, not a new topic."},"INVERSE_AS_RECIPROCAL":{"name":"The -1 exponent always means reciprocal","summary":"Reads f inverse, arcsine and similar notation as one over the function. Blocks inverse functions, logarithms and inverse trig simultaneously.","fix":"Separate the two meanings explicitly: on a NUMBER the -1 exponent means reciprocal, on a FUNCTION NAME it means undo. Verify with composition -- if it is really the inverse then f(f inverse (x)) returns x, and one over f will not do that. Make her run that check herself."},"RULE_OVERGENERALIZATION":{"name":"Right rule, wrong operation","summary":"Knows the exponent and logarithm rules exist but reaches for the wrong one -- multiplying exponents when adding is called for, and so on. Typically memorized as symbol patterns without the meaning underneath.","fix":"Re-derive from the definition rather than drilling the rule. Expand x^2 times x^3 as x x times x x x and count. Once she has counted it twice she stops needing to remember which rule it was."},"SIGN_MANAGEMENT":{"name":"Signs get lost under distribution or negation","summary":"Drops or mishandles a negative, especially when subtracting a quantity or squaring a negative. Low-glamour and high-cost: it turns correct method into a wrong answer, which hides the fact that the method was right.","fix":"Have her write the subtraction as adding the opposite, every time, for a week. Also separate -3^2 from (-3)^2 early. Score her work for METHOD and for ARITHMETIC separately so she can see the method was right."},"NOTATION_LITERALISM":{"name":"Notation read as literal arithmetic","summary":"Reads f(x) as f times x, or sine squared theta as sine of theta squared. The mathematics may be fine; the parsing is not.","fix":"Read the notation aloud together in words before any manipulation. Convention, not logic, so it has to be taught as convention -- but once named it usually resolves quickly."},"DIRECTION_INVERSION":{"name":"Inside-the-function changes run backwards","summary":"Expects f(x-2) to move a graph left, or reads the period and phase shift off the wrong part of a sine formula.","fix":"Do not teach the rule; test one point. In f(x-2), what input now gives the old output at 0? x = 2. So the point that was at 0 is now at 2: right. One point beats any mnemonic, and it survives into the trig chapter."},"INCOMPLETE_SOLUTION_SET":{"name":"Stops at the first solution","summary":"Drops the negative square root, reports only the calculator's angle, or skips the extraneous-solution check. Method correct, answer incomplete -- which is the most frustrating way to lose marks.","fix":"Make the last step of every solve explicit: how many solutions SHOULD this have, and have I got them all? For trig, sketch the unit circle and mark every crossing before writing anything down."},"PROCEDURAL_NO_DOMAIN":{"name":"Procedure runs without checking whether it is legal","summary":"Cancels across a sum, ignores a zero denominator, or accepts the log of a negative number. The steps are fluent and the constraints are invisible.","fix":"Add a standing habit: before solving, write down what x is not allowed to be; after solving, check every answer against that line. Two extra lines of work, and it removes a whole category of lost marks."}},"misconceptions":{"LIN_SQUARE_SUM":{"name":"Squares a sum term by term","family":"LINEARITY_ILLUSION","signature":"(a+b)^2 -> a^2 + b^2","root":"Applies the distributive law to an exponent, which it does not govern.","fix":"Expand it as (a+b)(a+b) once by hand; the middle term appears and cannot be unseen.","probe":"Expand (x+3)^2."},"LIN_SQRT_SUM":{"name":"Splits a radical over a sum","family":"LINEARITY_ILLUSION","signature":"sqrt(a^2+b^2) -> a + b","root":"Extends the true rule for products to sums.","fix":"Numbers settle it: sqrt(9+16)=5, not 7. Radicals split over times and divide, never plus.","probe":"Simplify sqrt(9+16)."},"LIN_LOG_SUM":{"name":"Splits a log over a sum","family":"LINEARITY_ILLUSION","signature":"log(a+b) -> log a + log b","root":"Runs the product rule backwards onto an addition.","fix":"The rule turns a PRODUCT into a sum. There is no rule for a sum -- it must be factored first.","probe":"Can log(x+5) be expanded?"},"LIN_FRAC_SPLIT_DEN":{"name":"Splits a fraction over a denominator sum","family":"LINEARITY_ILLUSION","signature":"c/(a+b) -> c/a + c/b","root":"Mirrors the legal split over a NUMERATOR sum onto the denominator.","fix":"Test with numbers: 1/(1+1)=0.5 but 1/1+1/1=2. Splitting works on top, never on the bottom.","probe":"Does 1/(2+3) equal 1/2 + 1/3?"},"LIN_SIN_SUM":{"name":"Distributes sine over a sum","family":"LINEARITY_ILLUSION","signature":"sin(A+B) -> sin A + sin B","root":"Reads sin as a multiplier rather than a function name.","fix":"Check at A=B=90 degrees: sin(180)=0 but sin90+sin90=2. That is why the sum formula exists.","probe":"Does sin(90+90) equal sin90 + sin90?"},"LIN_FN_ADD":{"name":"Distributes a function over its input sum","family":"LINEARITY_ILLUSION","signature":"f(x+h) -> f(x) + f(h)","root":"Same belief as above, at the level of a general function.","fix":"Substitute the whole quantity into every x, with brackets. Do it slowly once.","probe":"For f(x)=x^2, find f(x+h)."},"INV_FN_RECIPROCAL":{"name":"Reads the inverse function as one over the function","family":"INVERSE_AS_RECIPROCAL","signature":"f^-1(x) -> 1/f(x)","root":"Carries the numeric meaning of a -1 exponent onto a function name.","fix":"Verify by composition: the inverse must send f(x) back to x; the reciprocal will not.","probe":"If f(x)=x+3, what is f inverse of x?"},"INV_TRIG_RECIPROCAL":{"name":"Confuses arcsine with cosecant","family":"INVERSE_AS_RECIPROCAL","signature":"sin^-1(x) -> 1/sin(x)","root":"Same notation collision, made worse because cosecant genuinely is 1/sin.","fix":"Name them apart: arcsin returns an ANGLE, csc returns a RATIO. Ask which one the answer should be.","probe":"Is arcsin(0.5) an angle or a ratio?"},"INV_LOG_AS_DIV":{"name":"Turns a log quotient into a quotient of logs","family":"INVERSE_AS_RECIPROCAL","signature":"log(a/b) -> (log a)/(log b)","root":"Blends the quotient rule with the change-of-base formula.","fix":"Quotient rule gives a DIFFERENCE. A quotient of logs is change of base, a different tool.","probe":"Expand log(x/5)."},"EXP_PROD_MULTIPLY":{"name":"Multiplies exponents when multiplying like bases","family":"RULE_OVERGENERALIZATION","signature":"x^a * x^b -> x^(ab)","root":"Confuses the product rule with the power rule.","fix":"Count it: x^2 x^3 written out is five x's. Adding, not multiplying.","probe":"Simplify x^2 times x^3."},"EXP_QUOT_REVERSED":{"name":"Subtracts exponents in the wrong order","family":"RULE_OVERGENERALIZATION","signature":"x^a / x^b -> x^(b-a)","root":"Remembers 'subtract' without anchoring which one leads.","fix":"Top minus bottom, always. Sanity-check with x^5/x^2 = x^3.","probe":"Simplify x^3 / x^5."},"EXP_POWER_ADD":{"name":"Adds exponents when raising a power to a power","family":"RULE_OVERGENERALIZATION","signature":"(x^a)^b -> x^(a+b)","root":"The mirror image of the product-rule confusion.","fix":"Expand (x^2)^3 as x^2 x^2 x^2 and count to six.","probe":"Simplify (x^2)^3."},"EXP_NEG_AS_SIGN":{"name":"Reads a negative exponent as a negative value","family":"RULE_OVERGENERALIZATION","signature":"x^-2 -> -x^2","root":"Transfers the minus sign from the exponent to the base.","fix":"2^-1 is 0.5, not -2. A negative exponent flips; it never changes the sign.","probe":"Evaluate 2^-3."},"EXP_RATIONAL_INVERTED":{"name":"Swaps root and power in a rational exponent","family":"RULE_OVERGENERALIZATION","signature":"a^(2/3) -> the square root of a cubed","root":"Knows both numbers matter but not which does which.","fix":"Denominator is the root, numerator is the power. Test on 8^(1/3)=2.","probe":"Evaluate 8^(2/3)."},"LOG_POWER_OUTSIDE":{"name":"Moves an exponent out of the wrong position","family":"RULE_OVERGENERALIZATION","signature":"(log a)^n <-> log(a^n)","root":"Loses track of what the exponent is attached to.","fix":"Only an exponent ON THE ARGUMENT comes down. Bracket the argument first.","probe":"Is (log x)^2 the same as log(x^2)?"},"LOG_BASE_DROPPED":{"name":"Ignores the base when converting to exponential form","family":"RULE_OVERGENERALIZATION","signature":"log_b(x)=y -> 10^y = x","root":"Defaults to base 10 because that is the calculator button.","fix":"Say it as a sentence: the base, raised to the answer, gives the argument.","probe":"Rewrite log_3(9)=2 in exponential form."},"SIGN_DISTRIB_NEG":{"name":"Distributes a negative to only the first term","family":"SIGN_MANAGEMENT","signature":"-(a-b) -> -a - b","root":"Applies the sign once and moves on.","fix":"Rewrite as (-1) times the bracket and distribute explicitly.","probe":"Simplify -(x-4)."},"SIGN_SQUARE_NEG":{"name":"Confuses -3^2 with (-3)^2","family":"SIGN_MANAGEMENT","signature":"-3^2 -> 9","root":"Treats the minus as part of the base when no bracket says so.","fix":"Without brackets the exponent binds tighter, so it is minus (three squared).","probe":"Evaluate -3^2 and (-3)^2."},"SIGN_QUADFORM_B":{"name":"Drops the sign of b in the quadratic formula","family":"SIGN_MANAGEMENT","signature":"uses b instead of -b","root":"Copies the formula shape without tracking the sign of the coefficient.","fix":"Write a, b, c on their own line with signs before substituting. Always.","probe":"Solve x^2 - 5x + 6 = 0 with the formula."},"NOT_FN_AS_MULT":{"name":"Reads f(x) as f times x","family":"NOTATION_LITERALISM","signature":"f(x+2) -> f*x + f*2","root":"Brackets after a letter usually do mean multiplication -- until they name a function.","fix":"Read it aloud as 'f of x'. Rename the function to something non-algebraic for a session.","probe":"For f(x)=3x, what is f(2)?"},"NOT_TRIG_SQUARED":{"name":"Confuses sine squared with sine of a square","family":"NOTATION_LITERALISM","signature":"sin^2(x) -> sin(x^2)","root":"Ambiguous historical notation, genuinely badly designed.","fix":"Rewrite sin^2(x) as (sin x)^2 in her own work until the parse is automatic.","probe":"Is sin^2(x) equal to sin(x^2)?"},"NOT_COMPOSITION_MULT":{"name":"Reads composition as multiplication","family":"NOTATION_LITERALISM","signature":"(f o g)(x) -> f(x) * g(x)","root":"The composition ring is unfamiliar and looks like an operator.","fix":"Feed a number through both machines in order and watch the output differ from the product.","probe":"If f(x)=x+1 and g(x)=2x, find f(g(3))."},"DIR_SHIFT_BACKWARDS":{"name":"Shifts horizontally the wrong way","family":"DIRECTION_INVERSION","signature":"f(x-2) -> graph moves left","root":"Reads the minus sign as a direction rather than as an input adjustment.","fix":"Test one point: which x makes the bracket zero? That is where the old zero went.","probe":"Which way does y=(x-3)^2 move?"},"DIR_PERIOD_MULTIPLIED":{"name":"Multiplies by b instead of dividing to get the period","family":"DIRECTION_INVERSION","signature":"period of sin(bx) -> 2*pi*b","root":"Assumes a bigger coefficient means a bigger period.","fix":"A bigger b means faster, so shorter. Period is 2 pi divided by b. Sketch sin(2x) once.","probe":"What is the period of sin(2x)?"},"DIR_TRANSFORM_ORDER":{"name":"Applies stretches and shifts in the wrong order","family":"DIRECTION_INVERSION","signature":"ignores factoring before reading the shift","root":"Reads the constants off in written order rather than operation order.","fix":"Factor the inside completely first: b(x-c). The shift is only readable after factoring.","probe":"Find the phase shift of sin(2x - pi)."},"DIR_INSIDE_OUTSIDE":{"name":"Swaps vertical and horizontal effects","family":"DIRECTION_INVERSION","signature":"f(x)+2 -> moves right","root":"Has not separated changes to the input from changes to the output.","fix":"Outside the function touches y and behaves normally; inside touches x and reverses.","probe":"Which way does y=x^2+4 move?"},"INC_SQRT_POSITIVE_ONLY":{"name":"Takes only the positive square root","family":"INCOMPLETE_SOLUTION_SET","signature":"x^2=9 -> x=3","root":"Confuses the square-root operation, which is positive by definition, with solving.","fix":"Solving an equation is not applying a function. Both signs square to 9.","probe":"Solve x^2 = 16."},"INC_TRIG_ONE_SOLUTION":{"name":"Reports only the calculator angle","family":"INCOMPLETE_SOLUTION_SET","signature":"sin(x)=0.5 on [0,2pi) -> x=pi/6 only","root":"Inverse trig returns one value; the equation has more.","fix":"Sketch the unit circle, draw the horizontal line, count the crossings BEFORE writing.","probe":"Solve sin(x)=1/2 on [0,2pi)."},"INC_ZERO_PRODUCT_MISUSE":{"name":"Applies the zero-product rule to a non-zero product","family":"INCOMPLETE_SOLUTION_SET","signature":"(x-2)(x-3)=6 -> x-2=6 or x-3=6","root":"Uses the factored shortcut without the zero that licenses it.","fix":"The rule needs zero on one side. Expand, move everything over, then factor.","probe":"Solve (x-2)(x-3)=6."},"INC_EXTRANEOUS_UNCHECKED":{"name":"Does not check for extraneous solutions","family":"INCOMPLETE_SOLUTION_SET","signature":"accepts every root after squaring or clearing denominators","root":"Squaring and clearing denominators are not reversible, so they can invent roots.","fix":"Any solve that squared or cleared a denominator is unfinished until each root is checked.","probe":"Solve sqrt(x+6)=x and check both roots."},"INC_ABS_ONE_CASE":{"name":"Solves only the positive case of an absolute value","family":"INCOMPLETE_SOLUTION_SET","signature":"|x-1|=5 -> x=6 only","root":"Reads the bars as decoration rather than as two cases.","fix":"Absolute value always splits into two equations. Write both before solving either.","probe":"Solve |x-1|=5."},"DOM_CANCEL_ADDEND":{"name":"Cancels a term across a sum","family":"PROCEDURAL_NO_DOMAIN","signature":"(x+3)/3 -> x","root":"Cancellation is a factor operation applied to an addend.","fix":"Only whole factors cancel. Factor first; if it will not factor, nothing cancels.","probe":"Simplify (x+3)/3."},"DOM_IGNORE_RESTRICTION":{"name":"Ignores values excluded from the domain","family":"PROCEDURAL_NO_DOMAIN","signature":"reports a root that makes a denominator zero","root":"Solves the equation without ever asking what x is allowed to be.","fix":"Write the excluded values down before solving, and check the answers against that line.","probe":"Solve x/(x-2) = 2/(x-2)."},"DOM_LOG_NEGATIVE":{"name":"Accepts the log of a negative or zero","family":"PROCEDURAL_NO_DOMAIN","signature":"keeps a root that makes a log argument non-positive","root":"Treats the algebra as complete when the domain still rules a root out.","fix":"Every log argument must be strictly positive. Substitute each root back in and confirm.","probe":"Solve log(x)+log(x-3)=1 and check both roots."},"DOM_HOLE_AS_ASYMPTOTE":{"name":"Calls a hole a vertical asymptote","family":"PROCEDURAL_NO_DOMAIN","signature":"reports an asymptote at a cancelled factor","root":"Reads the original denominator without simplifying first.","fix":"Factor and cancel first. A cancelled factor leaves a hole; a surviving one gives an asymptote.","probe":"Where are the asymptotes and holes of (x^2-4)/(x-2)?"},"DOM_INEQ_NO_FLIP":{"name":"Does not flip the inequality on a negative multiplier","family":"PROCEDURAL_NO_DOMAIN","signature":"-2x > 6 -> x > -3","root":"Applies equation moves to an inequality without the extra rule.","fix":"Test a number from the answer set. -4 satisfies -2x>6; -2 does not. The sign must flip.","probe":"Solve -2x > 6."},"DOM_INEQ_CROSS_MULT":{"name":"Cross-multiplies a rational inequality","family":"PROCEDURAL_NO_DOMAIN","signature":"multiplies by a variable of unknown sign","root":"Multiplying by a variable is only legal once its sign is known.","fix":"Move everything to one side, combine, and use a sign chart instead.","probe":"Solve 1/x < 2."},"TRIG_DEGREE_RADIAN_MODE":{"name":"Mixes degrees and radians","family":"RULE_OVERGENERALIZATION","signature":"evaluates sin(pi/6) in degree mode","root":"Treats the calculator mode as a setting rather than as part of the question.","fix":"If the angle contains pi, the mode is radians. Check the mode before every trig session.","probe":"Evaluate sin(pi/6) exactly."},"TRIG_COORD_SWAP":{"name":"Swaps sine and cosine on the unit circle","family":"NOTATION_LITERALISM","signature":"cos(theta) read as the y-coordinate","root":"Memorized the pairs without anchoring which coordinate is which.","fix":"Alphabetical: cosine goes with x, sine goes with y. Confirm at theta=0, the point (1,0).","probe":"What are the coordinates at theta=0?"},"TRIG_QUADRANT_SIGN":{"name":"Uses the reference angle without fixing the quadrant sign","family":"SIGN_MANAGEMENT","signature":"cos(2pi/3) -> +1/2","root":"Finds the right magnitude and stops before the sign step.","fix":"Reference angle gives the size; the quadrant gives the sign. Two steps, never one.","probe":"Evaluate cos(2pi/3)."},"TRIG_LAW_CHOICE":{"name":"Picks the wrong law for the given parts","family":"RULE_OVERGENERALIZATION","signature":"uses law of sines on side-angle-side","root":"Selects by familiarity instead of by which parts are known.","fix":"Law of sines needs a matched angle-side PAIR. No pair means law of cosines.","probe":"Given two sides and the included angle, which law applies?"},"POLY_MULTIPLICITY_IGNORED":{"name":"Treats every zero as a crossing","family":"RULE_OVERGENERALIZATION","signature":"graphs (x-2)^2 as crossing the axis","root":"Finds the zeros correctly and ignores their multiplicity.","fix":"Odd multiplicity crosses, even multiplicity bounces. Sketch (x-2)^2 next to (x-2).","probe":"Does y=(x-1)^2(x+3) cross or touch at x=1?"},"RAT_ASYMPTOTE_DEGREE":{"name":"Gets the horizontal asymptote rule backwards","family":"RULE_OVERGENERALIZATION","signature":"top degree larger -> y=0","root":"Remembers three cases and mismatches them.","fix":"Bottom bigger wins, giving y=0. Equal degrees give the leading-coefficient ratio. Top bigger has none.","probe":"Find the horizontal asymptote of (2x^2+1)/(x^2-3)."},"FN_DOMAIN_RANGE_SWAP":{"name":"Reports the range when asked for the domain","family":"NOTATION_LITERALISM","signature":"domain and range interchanged","root":"Knows both sets and has not fixed which name belongs to which axis.","fix":"Domain is the inputs, the x's, read left to right. Range is the outputs, read bottom to top.","probe":"State the domain and range of y=sqrt(x)."},"COMP_ORDER_SWAPPED":{"name":"Composes in the wrong order","family":"NOTATION_LITERALISM","signature":"f(g(x)) computed as g(f(x))","root":"Reads left to right, but the inner function acts first.","fix":"Work outward from the innermost bracket, exactly as with arithmetic.","probe":"If f(x)=x^2 and g(x)=x+1, find f(g(2)) and g(f(2))."}},"items":[{"id":"absolute_value-01","kc":"absolute_value","difficulty":1,"stem":"Synthetic probe 1 for Absolute value equations &amp; inequalities: compute <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mo>+</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">2 + 3</annotation></semantics></math></span>.","plain":"Synthetic probe 1 for Absolute value equations & inequalities: compute 2 + 3.","hint":"Add the two numbers.","worked":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mo>+</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">2 + 3</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">= 5</annotation></semantics></math></span>"],"options":[{"text":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>","plain":"5","correct":true,"mis":null},{"text":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">6</annotation></semantics></math></span>","plain":"6","correct":false,"mis":"INC_ABS_ONE_CASE"},{"text":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">-1</annotation></semantics></math></span>","plain":"-1","correct":false,"mis":"EXP_PROD_MULTIPLY"},{"text":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">12</annotation></semantics></math></span>","plain":"12","correct":false,"mis":"EXP_QUOT_REVERSED"}]},{"id":"absolute_value-02","kc":"absolute_value","difficulty":2,"stem":"Synthetic probe 2 for Absolute value equations &amp; inequalities: compute <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo>+</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">3 + 4</annotation></semantics></math></span>.","plain":"Synthetic probe 2 for Absolute value equations & inequalities: compute 3 + 4.","hint":"Add the two numbers.","worked":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo>+</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">3 + 4</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">= 7</annotation></semantics></math></span>"],"options":[{"text":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">7</annotation></semantics></math></span>","plain":"7","correct":true,"mis":null},{"text":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">12</annotation></semantics></math></span>","plain":"12","correct":false,"mis":"EXP_PROD_MULTIPLY"},{"text":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">-1</annotation></semantics></math></span>","plain":"-1","correct":false,"mis":"EXP_QUOT_REVERSED"},{"text":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>14</mn></mrow><annotation encoding=\"application/x-tex\">14</anno const BKT_L0 = 0.30, BKT_T = 0.35, BKT_SLIP = 0.10, BKT_GUESS = 0.25;
const TAU_HOURS = 48.0;
const CONF_VALUE = { guessing: 0.20, shaky: 0.55, confident: 0.88 };

function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

function bktUpdate(pL, correct) {
  pL = clamp(pL, 0, 1);
  const s = BKT_SLIP, g = BKT_GUESS;
  let num, den;
  if (correct) { num = pL * (1 - s); den = num + (1 - pL) * g; }
  else { num = pL * s; den = num + (1 - pL) * (1 - g); }
  const post = den > 0 ? num / den : pL;
  return clamp(post + (1 - post) * BKT_T, 0, 1);
}

function displayedProficiency(pL, hoursStale) {
  return clamp(pL, 0, 1) * Math.exp(-Math.max(0, hoursStale) / TAU_HOURS);
}

function eloExpected(theta, diff) { return 1 / (1 + Math.pow(10, (diff - theta) / 400)); }

function reviewPriority(conf, correct, box) {
  const c = clamp(conf, 0, 1), wrong = correct ? 0 : 1;
  const miscal = Math.abs(c - (correct ? 1 : 0));
  return 4 * c * wrong + 1.5 * miscal + (box === 1 ? 1 : 0);
}

function prereqClosure(kcId) {
  /* Every KC this one transitively needs, deepest-first. Drives the descent. */
  const seen = {}, order = [];
  (function visit(n) {
    const k = KC_BY_ID[n]; if (!k) return;
    k.prereqs.forEach(p => { if (!seen[p]) { seen[p] = 1; visit(p); order.push(p); } });
  })(kcId);
  return order;
}

/* ---------------------------------------------------------------------
 * State
 * ------------------------------------------------------------------- */
function blank() {
  return {
    v: 1, created: Date.now(), name: STUDENT,
    diag: { started: 0, finished: 0, plan: [], idx: 0, desc: [], didx: 0, asked: [] },
    attempts: [],       // the raw log; everything else is derived from it
    kc: {},             // kcId -> {pL, n, ok, lastOk}
    practice: { box: {} },
  };
}
let S = blank();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const p = JSON.parse(raw); if (p && p.v === 1) S = p; }
  } catch (e) { /* corrupt or unavailable storage must not brick the app */ }
  return S;
}
/* When the tutor opens a shared link, S is replaced by HER session. Any save()
 * after that would overwrite whatever is on HIS device, so saving is disabled
 * for as long as an imported session is on screen. */
let VIEWING_IMPORT = false;
function save() {
  if (VIEWING_IMPORT) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

function kcState(id) {
  if (!S.kc[id]) S.kc[id] = { pL: BKT_L0, n: 0, ok: 0, lastOk: 0 };
  return S.kc[id];
}
function tested(id) { return (S.kc[id] || { n: 0 }).n > 0; }
function kcPassed(id) { const k = S.kc[id]; return !!k && k.n > 0 && k.ok >= Math.ceil(k.n / 2); }

/* ---------------------------------------------------------------------
 * Item selection
 * ------------------------------------------------------------------- */
function pickItem(kcId, wantDiff) {
  const pool = (ITEMS_BY_KC[kcId] || []).filter(it => S.diag.asked.indexOf(it.id) < 0);
  if (!pool.length) return null;
  let best = pool[0], bestD = 1e9;
  for (const it of pool) {
    const d = Math.abs((it.difficulty || 3) - wantDiff);
    if (d < bestD) { bestD = d; best = it; }
  }
  return best;
}

/* ---------------------------------------------------------------------
 * The adaptive descent -- BREADTH FIRST, THEN DEPTH.
 *
 * Phase 1 asks every anchor once. That guarantees the report covers the whole
 * course: if descents were spliced in inline, a student who struggled early
 * would burn the question budget in chapter 1 and the report would silently
 * say nothing at all about trigonometry.
 *
 * Phase 2 spends whatever budget is left descending into the anchors that
 * failed, walking each prerequisite closure DEEPEST-FIRST and stopping that
 * branch at the first prerequisite that also fails -- that one is the root
 * cause, and everything above it is collateral damage.
 * ------------------------------------------------------------------- */
function buildPlan() {
  const byChapter = ANCHORS.slice().sort((a, b) => {
    const ca = KC_BY_ID[a].chapter, cb = KC_BY_ID[b].chapter;
    const na = ca === 'prereq' ? 0 : parseInt(ca, 10);
    const nb = cb === 'prereq' ? 0 : parseInt(cb, 10);
    return na - nb;
  });
  return byChapter.map(kc => ({ kc: kc, anchor: kc, depth: 0 }));
}

function rootKnownUnder(kcId) {
  /* Is something beneath this KC already known to be broken? If so we already
     have the explanation and digging further just re-confirms it. */
  return prereqClosure(kcId).some(p => tested(p) && !kcPassed(p));
}

function queueDescent(anchorKc) {
  const d = S.diag;
  const have = {};
  d.desc.forEach(e => { have[e.kc] = 1; });
  prereqClosure(anchorKc).forEach(p => {          // already deepest-first
    if (!have[p] && !tested(p) && (ITEMS_BY_KC[p] || []).length) {
      d.desc.push({ kc: p, anchor: anchorKc, depth: 1 });
    }
  });
}

function nextEntry() {
  const d = S.diag;
  if (d.asked.length >= DIAG_CAP) return null;
  // Phase 1 -- every anchor, so the report covers the whole course.
  while (d.idx < d.plan.length) {
    const e = d.plan[d.idx];
    if (tested(e.kc) || !(ITEMS_BY_KC[e.kc] || []).length) { d.idx++; continue; }
    return e;
  }
  // Phase 2 -- descend into what failed, with whatever budget is left.
  while (d.didx < d.desc.length) {
    const e = d.desc[d.didx];
    if (tested(e.kc) || !(ITEMS_BY_KC[e.kc] || []).length) { d.didx++; continue; }
    if (rootKnownUnder(e.anchor)) { d.didx++; continue; }
    return e;
  }
  return null;
}

function onDiagnosticResult(entry, correct) {
  const d = S.diag;
  if (entry.depth === 0) {
    d.idx++;
    if (!correct && !rootKnownUnder(entry.kc)) queueDescent(entry.kc);
  } else {
    // A failed prerequisite is the root for that branch; nextEntry's
    // rootKnownUnder guard stops the rest of that anchor's descent.
    d.didx++;
  }
}

/* ---------------------------------------------------------------------
 * Recording an attempt -- this is the telemetry that makes the app useful
 * ------------------------------------------------------------------- */
function record(a) {
  S.attempts.push(a);
  const k = kcState(a.kc);
  k.pL = bktUpdate(k.pL, a.correct);
  k.n += 1;
  if (a.correct) { k.ok += 1; k.lastOk = a.ts; }
  save();
}

/* ---------------------------------------------------------------------
 * Analysis -- everything the tutor dashboard reports is derived here
 * ------------------------------------------------------------------- */
function rootCauses() {
  /* KCs that failed and have no failing prerequisite beneath them.
     Those are the things worth teaching; everything above is downstream. */
  const failed = KCS.filter(k => tested(k.id) && !kcPassed(k.id)).map(k => k.id);
  const fset = {}; failed.forEach(f => fset[f] = 1);
  const roots = failed.filter(f => !prereqClosure(f).some(p => fset[p]));
  return roots.map(id => {
    const blocks = KCS.filter(k => k.id !== id && prereqClosure(k.id).indexOf(id) >= 0)
                      .map(k => k.id);
    return {
      kc: id,
      name: KC_BY_ID[id].name,
      tier: KC_BY_ID[id].tier,
      blurb: KC_BY_ID[id].blurb,
      blocks: blocks,
      blockedFailing: blocks.filter(b => tested(b) && !kcPassed(b)),
      evidence: (S.kc[id] || {}).n || 0,
    };
  }).sort((a, b) => b.blocks.length - a.blocks.length);
}

function familyFindings() {
  /* Group her actual errors by the belief behind them. One bug, N places. */
  const hits = {};
  S.attempts.forEach(a => {
    if (a.correct || !a.mis || !MIS[a.mis]) return;
    const f = MIS[a.mis].family;
    if (!hits[f]) hits[f] = { family: f, count: 0, mis: {}, kcs: {} };
    hits[f].count++;
    hits[f].mis[a.mis] = (hits[f].mis[a.mis] || 0) + 1;
    hits[f].kcs[a.kc] = 1;
  });
  return Object.keys(hits).map(f => ({
    family: f,
    name: FAM[f].name,
    summary: FAM[f].summary,
    fix: FAM[f].fix,
    count: hits[f].count,
    spread: Object.keys(hits[f].kcs).length,
    misconceptions: Object.keys(hits[f].mis)
      .sort((a, b) => hits[f].mis[b] - hits[f].mis[a])
      .map(id => ({ id: id, n: hits[f].mis[id], m: MIS[id] })),
  })).sort((a, b) => (b.spread - a.spread) || (b.count - a.count));
}

function calibration() {
  const box = { confWrong: [], confRight: [], unsureRight: [], unsureWrong: [] };
  S.attempts.forEach(a => {
    const c = CONF_VALUE[a.conf] >= 0.8;
    if (c && a.correct) box.confRight.push(a);
    else if (c && !a.correct) box.confWrong.push(a);
    else if (!c && a.correct) box.unsureRight.push(a);
    else box.unsureWrong.push(a);
  });
  return box;
}

function median(xs) {
  if (!xs.length) return 0;
  const s = xs.slice().sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
}

function processStats() {
  const A = S.attempts;
  if (!A.length) return null;
  const right = A.filter(a => a.correct), wrong = A.filter(a => !a.correct);
  const medAll = median(A.map(a => a.msTotal));
  const fastWrong = wrong.filter(a => a.msTotal < medAll * 0.6).length;
  const slowWrong = wrong.filter(a => a.msTotal > medAll * 1.5).length;
  return {
    n: A.length,
    correct: right.length,
    pct: Math.round(100 * right.length / A.length),
    medianSec: Math.round(medAll / 1000),
    medianReadSec: Math.round(median(A.map(a => a.msFirst)) / 1000),
    medianRightSec: Math.round(median(right.map(a => a.msTotal)) / 1000),
    medianWrongSec: Math.round(median(wrong.map(a => a.msTotal)) / 1000),
    fastWrong: fastWrong,
    slowWrong: slowWrong,
    hints: A.filter(a => a.hint).length,
    changes: A.reduce((n, a) => n + (a.changes || 0), 0),
    changedToWrong: A.filter(a => a.chFromCorrect).length,
    changedToRight: A.filter(a => a.chToCorrect).length,
    totalMin: Math.round(A.reduce((n, a) => n + a.msTotal, 0) / 60000),
  };
}

function agenda() {
  /* The ordered thing to actually do in the next session. */
  const out = [];
  familyFindings().slice(0, 2).forEach(f => out.push({
    kind: 'family', title: f.name,
    why: 'Showed up in ' + f.spread + ' different topic' + (f.spread === 1 ? '' : 's') +
         ' (' + f.count + ' error' + (f.count === 1 ? '' : 's') + '). Fixing the belief fixes all of them.',
    how: f.fix,
    probes: f.misconceptions.slice(0, 3).map(m => m.m.probe),
  }));
  rootCauses().slice(0, 3).forEach(r => out.push({
    kind: 'root', title: r.name,
    why: r.blockedFailing.length
      ? 'Underneath ' + r.blockedFailing.length + ' other thing' +
        (r.blockedFailing.length === 1 ? '' : 's') + ' she missed: ' +
        r.blockedFailing.slice(0, 3).map(b => KC_BY_ID[b].name).join(', ') + '.'
      : 'Missed directly, with nothing broken beneath it.',
    how: r.blurb,
    probes: [],
  }));
  const cw = calibration().confWrong;
  if (cw.length) out.unshift({
    kind: 'calib', title: 'Confident and wrong (' + cw.length + ')',
    why: 'She does not know these are wrong, so she will not ask about them. They are also the ' +
         'most correctable: being surprised by an error makes it stick.',
    how: 'Open with these. Ask her to explain the method BEFORE saying anything about right or wrong.',
    probes: cw.slice(0, 4).map(a => (ITEM_BY_ID[a.id] || {}).plain || a.kc),
  });
  return out;
}

/* ---------------------------------------------------------------------
 * Share payload -- her device to his device, never through a server.
 * Pure base64url of compact JSON; no browser API so it is testable offline.
 * ------------------------------------------------------------------- */
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function toB64u(str) {
  const b = []; for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    if (c < 128) b.push(c);
    else if (c < 2048) { b.push(192 | (c >> 6), 128 | (c & 63)); }
    else { b.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); }
  }
  let out = '';
  for (let i = 0; i < b.length; i += 3) {
    const n = (b[i] << 16) | ((b[i + 1] || 0) << 8) | (b[i + 2] || 0);
    out += B64[(n >> 18) & 63] + B64[(n >> 12) & 63];
    out += i + 1 < b.length ? B64[(n >> 6) & 63] : '';
    out += i + 2 < b.length ? B64[n & 63] : '';
  }
  return out;
}
function fromB64u(s) {
  const b = [];
  for (let i = 0; i < s.length; i += 4) {
    const n = (B64.indexOf(s[i]) << 18) | (B64.indexOf(s[i + 1]) << 12) |
              ((s[i + 2] ? B64.indexOf(s[i + 2]) : 0) << 6) | (s[i + 3] ? B64.indexOf(s[i + 3]) : 0);
    b.push((n >> 16) & 255);
    if (s[i + 2]) b.push((n >> 8) & 255);
    if (s[i + 3]) b.push(n & 255);
  }
  let out = '';
  for (let i = 0; i < b.length; i++) {
    const c = b[i];
    if (c < 128) out += String.fromCharCode(c);
    else if (c < 224) { out += String.fromCharCode(((c & 31) << 6) | (b[++i] & 63)); }
    else { out += String.fromCharCode(((c & 15) << 12) | ((b[++i] & 63) << 6) | (b[++i] & 63)); }
  }
  return out;
}
function packSession() {
  return {
    v: 1, b: DATA.serial, n: S.name, c: S.created, f: S.diag.finished,
    a: S.attempts.map(a => [a.id, a.kc, a.correct ? 1 : 0, a.mis || '', a.conf,
                            a.msFirst, a.msTotal, a.changes || 0,
                            a.chFromCorrect ? 1 : 0, a.hint ? 1 : 0, a.ts]),
  };
}
function encodeShare() { return toB64u(JSON.stringify(packSession())); }
function decodeShare(code) {
  const p = JSON.parse(fromB64u(code.trim()));
  if (!p || p.v !== 1 || !Array.isArray(p.a)) throw new Error('not a Precalc 1113 code');
  const st = blank();
  st.name = p.n; st.created = p.c; st.diag.finished = p.f;
  st.attempts = p.a.map(r => ({
    id: r[0], kc: r[1], correct: !!r[2], mis: r[3] || null, conf: r[4],
    msFirst: r[5], msTotal: r[6], changes: r[7], chFromCorrect: !!r[8],
    hint: !!r[9], ts: r[10],
  }));
  st.attempts.forEach(a => {
    if (!st.kc[a.kc]) st.kc[a.kc] = { pL: BKT_L0, n: 0, ok: 0, lastOk: 0 };
    const k = st.kc[a.kc];
    k.pL = bktUpdate(k.pL, a.correct); k.n++; if (a.correct) { k.ok++; k.lastOk = a.ts; }
  });
  return { state: st, stale: p.b !== DATA.serial };
}

/* =====================================================================
 * Rendering
 * ===================================================================== */
const app = () => document.getElementById('app');
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function clear() { const a = app(); a.innerHTML = ''; return a; }

let route = '';
function go(r) { route = r; if (typeof location !== 'undefined') location.hash = r; render(); }

/* ---------- navigation ---------- */
const NAV = [
  ['#/', '\u{1F3E0}', 'Home'],
  ['#/practice', '\u{1F3AF}', 'Practice'],
  ['#/results', '\u{1F4CA}', 'Results'],
  ['#/share', '\u{1F4E4}', 'Send'],
];
function renderNav() {
  const n = document.getElementById('nav');
  if (!n) return;
  const show = S.diag.finished && route.indexOf('/diagnostic') < 0 && route.indexOf('/tutor') < 0;
  n.className = show ? 'nav' : 'nav hidden';

  NAV.forEach(([r, i, label]) => {
    const b = el('button', route === r ? 'on' : '',
      '<span class="i">' + i + '</span>' + esc(label));
    b.onclick = () => go(r);
    n.appendChild(b);
  });
}

/* ---------- diagnostic ---------- */
let Q = null;   // {entry, item, t0, tFirst, chosen, changes, conf, chFromCorrect}

function startDiagnostic() {
  if (!S.diag.started) {
    S.diag.started = Date.now();
    S.diag.plan = buildPlan();
    S.diag.idx = 0;
    S.diag.asked = [];
    save();
  }
  go('#/diagnostic');
}

function finishDiagnostic() {
  S.diag.finished = Date.now();
  save();
  go('#/results');
}

function viewDiagnostic() {
  const entry = nextEntry();
  if (!entry) { finishDiagnostic(); return; }
  const kc = KC_BY_ID[entry.kc];
  const item = pickItem(entry.kc, entry.depth === 0 ? 3 : 2);
  if (!item) { S.diag.idx++; save(); viewDiagnostic(); return; }

  Q = { entry: entry, item: item, t0: Date.now(), tFirst: 0, chosen: null,
        changes: 0, conf: null, chFromCorrect: false, hint: false };

  const a = clear();
  const n = S.diag.asked.length + 1;
  // Never let the bar read full while questions remain: past the target the
  // denominator switches to the hard cap, and it tops out at 97%.
  const denom = (n - 1) >= DIAG_TARGET ? DIAG_CAP : DIAG_TARGET;
  const pct = Math.min(97, Math.round(100 * (n - 1) / denom));
  a.appendChild(el('div', 'bar', '<i style="width:' + pct + '%"></i>'));
  a.appendChild(el('div', 'small muted',
    'Question ' + n + (entry.depth ? ' · checking a step further back' : '')));

  const card = el('div', 'card');
  card.appendChild(el('div', '', item.stem));
  a.appendChild(card);

  // Confidence is asked BEFORE the answer. Crossed with correctness it gives
  // the single most useful signal in the whole app.
  const confWrap = el('div', '');
  confWrap.appendChild(el('h3', '', 'First — how sure are you?'));
  const conf = el('div', 'conf');
  [['guessing', '\u{1F937}', 'No idea'], ['shaky', '\u{1F914}', 'Think so'],
   ['confident', '\u{1F4AA}', 'Got this']].forEach(([v, e, label]) => {
    const b = el('button', '', '<span class="e">' + e + '</span>' + esc(label));
    b.onclick = () => {
      Q.conf = v;
      if (!Q.tFirst) Q.tFirst = Date.now() - Q.t0;
      a.removeChild(confWrap);
      a.appendChild(optionsBlock());
      if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
    };
    conf.appendChild(b);
  });
  confWrap.appendChild(conf);
  a.appendChild(confWrap);

  function optionsBlock() {
    const wrap = el('div', '');
    wrap.appendChild(el('h3', '', 'Your answer'));
    const btns = [];
    item.options.forEach((o, i) => {
      const b = el('button', '',
        '<span class="opt"><span class="k">' + 'ABCD'[i] + '</span>' +
        '<span class="t">' + o.text + '</span></span>');
      b.onclick = () => {
        if (Q.chosen !== null) {
          Q.changes++;
          const prev = item.options[Q.chosen];
          if (prev.correct && !o.correct) Q.chFromCorrect = true;
          if (!prev.correct && o.correct) Q.chToCorrect = true;
        }
        Q.chosen = i;
        btns.forEach((x, j) => { x.style.borderColor = j === i ? '#2f7ff0' : '#2f3b59'; });
        sub.disabled = false;
      };
      btns.push(b);
      wrap.appendChild(b);
    });

    const hint = el('button', 'btn-ghost small', 'Give me a nudge');
    hint.onclick = () => {
      Q.hint = true;
      hint.outerHTML = '<div class="card tight small"><b>Nudge:</b> ' + item.hint + '</div>';
    };
    wrap.appendChild(hint);

    const sub = el('button', 'btn-primary', 'Submit');
    sub.disabled = true;
    sub.onclick = () => submitAnswer();
    wrap.appendChild(sub);
    return wrap;
  }
  renderNav();
}

function submitAnswer() {
  const item = Q.item, o = item.options[Q.chosen];
  const attempt = {
    id: item.id, kc: item.kc, ts: Date.now(), correct: !!o.correct,
    chosen: Q.chosen, mis: o.correct ? null : (o.mis || null), conf: Q.conf,
    msFirst: Q.tFirst, msTotal: Date.now() - Q.t0, changes: Q.changes,
    chFromCorrect: !!Q.chFromCorrect, chToCorrect: !!Q.chToCorrect, hint: Q.hint,
  };
  S.diag.asked.push(item.id);
  record(attempt);
  onDiagnosticResult(Q.entry, attempt.correct);
  save();

  // Thin feedback on purpose: keeps the measurement clean and the pace up.
  // Full explanations are unlocked on the results screen.
  const a = clear();
  a.appendChild(el('div', 'card ' + (attempt.correct ? '' : ''),
    '<h2 style="margin-top:0">' + (attempt.correct ? '✅ Correct' : '❌ Not quite') +
    '</h2>' + (attempt.correct
      ? '<p class="muted small">Nice — moving on.</p>'
      : '<p class="muted small">That’s useful. We’ll come back to this one at the ' +
        'end with the full working.</p>')));
  const b = el('button', 'btn-primary', 'Next question');
  b.onclick = () => {
    if (!nextEntry() || S.diag.asked.length >= DIAG_CAP) finishDiagnostic();
    else viewDiagnostic();
  };
  a.appendChild(b);
  if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
}

/* ---------- results (student-facing) ---------- */
function viewResults() {
  const a = clear();
  const st = processStats();
  if (!st) { a.appendChild(el('p', 'muted', 'No results yet.')); renderNav(); return; }

  a.appendChild(el('h1', '', 'What to work on'));

  const strong = KCS.filter(k => tested(k.id) && kcPassed(k.id));
  if (strong.length) {
    a.appendChild(el('div', 'card flag', '<h3 style="margin-top:0">Solid ✅</h3>' +
      '<p class="small muted">These held up. Don’t spend practice time here.</p>' +
      strong.map(k => '<span class="pill good">' + esc(k.name) + '</span>').join('')));
    a.lastChild.style.setProperty('--c', '#3ecf8e');
  }

  const roots = rootCauses();
  if (roots.length) {
    a.appendChild(el('h2', '', 'Start here'));
    a.appendChild(el('p', 'small muted',
      'These are the <b>underneath</b> things. Other questions went wrong because of them, ' +
      'so fixing these fixes more than one topic at a time.'));
    roots.slice(0, 3).forEach((r, i) => {
      const c = el('div', 'card flag');
      c.style.setProperty('--c', '#f0a93f');
      c.innerHTML = '<h2 style="margin-top:0">' + (i + 1) + '. ' + esc(r.name) + '</h2>' +
        '<p class="small">' + esc(r.blurb) + '</p>' +
        (r.blockedFailing.length
          ? '<p class="small muted">This one is underneath <b>' + r.blockedFailing.length +
            '</b> other question' + (r.blockedFailing.length === 1 ? '' : 's') +
            ' you missed.</p>' : '');
      a.appendChild(c);
    });
  }

  const missed = S.attempts.filter(x => !x.correct);
  if (missed.length) {
    a.appendChild(el('h2', '', 'Review what you missed (' + missed.length + ')'));
    missed.forEach(at => {
      const it = ITEM_BY_ID[at.id]; if (!it) return;
      const c = el('div', 'card');
      let h = '<div>' + it.stem + '</div>';
      const chosen = it.options[at.chosen], right = it.options.filter(o => o.correct)[0];
      h += '<p class="small" style="margin-top:12px"><span class="pill warn">You said</span> ' +
           (chosen ? chosen.text : '') + '</p>';
      h += '<p class="small"><span class="pill good">Answer</span> ' +
           (right ? right.text : '') + '</p>';
      if (at.mis && MIS[at.mis]) {
        h += '<div class="card tight" style="margin:12px 0 0;background:#1d2438">' +
             '<p class="small" style="margin:0 0 6px"><b>What happened:</b> ' +
             esc(MIS[at.mis].name) + '.</p>' +
             '<p class="small muted" style="margin:0">' + esc(MIS[at.mis].root) + '</p></div>';
      }
      if (it.worked && it.worked.length) {
        h += '<h3>Working</h3><ol class="steps small">' +
             it.worked.map(w => '<li>' + w + '</li>').join('') + '</ol>';
      }
      c.innerHTML = h;
      a.appendChild(c);
    });
  }
  const b = el('button', 'btn-primary', 'Send my progress to Javen');
  b.onclick = () => go('#/share');
  a.appendChild(b);
  renderNav();
}

/* ---------- practice ---------- */
let P = null;
function weakKcs() {
  return KCS.filter(k => tested(k.id) && !kcPassed(k.id))
            .sort((x, y) => (S.kc[x.id].pL - S.kc[y.id].pL));
}
function viewPractice() {
  const a = clear();
  a.appendChild(el('h1', '', 'Practice'));
  const weak = weakKcs();
  if (!weak.length) {
    a.appendChild(el('div', 'card', '<p>Nothing flagged as weak yet. Do the check-up first ' +
      'and this will fill up.</p>'));
    renderNav(); return;
  }
  a.appendChild(el('p', 'small muted', 'Pick something to drill. Full explanations here — ' +
    'this is the part where you’re meant to learn, not be measured.'));
  weak.forEach(k => {
    const pool = (ITEMS_BY_KC[k.id] || []);
    if (!pool.length) return;
    const pl = Math.round(100 * displayedProficiency(S.kc[k.id].pL, 0));
    const b = el('button', '',
      '<b>' + esc(k.name) + '</b><div class="meter"><i style="width:' + pl +
      '%;background:' + (pl < 40 ? '#f2607a' : pl < 70 ? '#f0a93f' : '#3ecf8e') +
      '"></i></div><div class="tiny muted" style="margin-top:5px">' + pool.length +
      ' questions available</div>');
    b.onclick = () => startPractice(k.id);
    a.appendChild(b);
  });
  renderNav();
}
function startPractice(kcId) {
  const pool = ITEMS_BY_KC[kcId] || [];
  const seen = {}; S.attempts.forEach(x => seen[x.id] = (seen[x.id] || 0) + 1);
  const sorted = pool.slice().sort((x, y) => (seen[x.id] || 0) - (seen[y.id] || 0));
  P = { kc: kcId, queue: sorted.slice(0, 5), i: 0 };
  practiceQuestion();
}
function practiceQuestion() {
  if (!P || P.i >= P.queue.length) { go('#/practice'); return; }
  const item = P.queue[P.i];
  Q = { entry: { kc: item.kc, depth: 0, anchor: item.kc }, item: item, t0: Date.now(),
        tFirst: 0, chosen: null, changes: 0, conf: 'shaky', chFromCorrect: false, hint: false };
  const a = clear();
  a.appendChild(el('div', 'small muted', KC_BY_ID[P.kc].name + ' · ' +
    (P.i + 1) + ' of ' + P.queue.length));
  const card = el('div', 'card'); card.appendChild(el('div', '', item.stem)); a.appendChild(card);
  const btns = [];
  item.options.forEach((o, i) => {
    const b = el('button', '',
      '<span class="opt"><span class="k">' + 'ABCD'[i] + '</span><span class="t">' +
      o.text + '</span></span>');
    b.onclick = () => {
      if (Q.chosen !== null) return;
      if (!Q.tFirst) Q.tFirst = Date.now() - Q.t0;
      Q.chosen = i;
      btns.forEach((x, j) => {
        if (item.options[j].correct) x.className = 'right';
        else if (j === i) x.className = 'wrong';
        x.onclick = null;
      });
      const at = {
        id: item.id, kc: item.kc, ts: Date.now(), correct: !!o.correct, chosen: i,
        mis: o.correct ? null : (o.mis || null), conf: 'shaky', msFirst: Q.tFirst,
        msTotal: Date.now() - Q.t0, changes: 0, chFromCorrect: false, hint: Q.hint,
      };
      record(at);
      const fb = el('div', 'card');
      let h = '';
      if (!o.correct && o.mis && MIS[o.mis]) {
        h += '<p class="small" style="margin:0 0 8px"><b>' + esc(MIS[o.mis].name) + '.</b> ' +
             esc(MIS[o.mis].root) + '</p>' +
             '<p class="small muted" style="margin:0 0 10px">' + esc(MIS[o.mis].fix) + '</p>';
      }
      if (item.worked && item.worked.length) {
        h += '<h3 style="margin-top:0">Working</h3><ol class="steps small">' +
             item.worked.map(w => '<li>' + w + '</li>').join('') + '</ol>';
      }
      fb.innerHTML = h;
      a.appendChild(fb);
      const nx = el('button', 'btn-primary', P.i + 1 >= P.queue.length ? 'Done' : 'Next');
      nx.onclick = () => { P.i++; practiceQuestion(); };
      a.appendChild(nx);
    };
    btns.push(b); a.appendChild(b);
  });
  renderNav();
}

/* ---------- share ---------- */
function viewShare() {
  const a = clear();
  a.appendChild(el('h1', '', 'Send to Javen'));
  const code = encodeShare();
  const base = (typeof location !== 'undefined' ? (location.origin + location.pathname) : '');
  const url = base + '#/tutor?d=' + code;
  a.appendChild(el('div', 'card',
    '<p>This sends Javen what you did — which questions, how long, how sure you were. ' +
    'It helps him plan the session so you’re not re-covering stuff you already know.</p>' +
    '<p class="small muted">Your answers stay between your phone and his. Nothing is stored ' +
    'on a website.</p>'));
  const b = el('button', 'btn-primary', 'Share the link');
  b.onclick = () => {
    if (typeof navigator !== 'undefined' && navigator.share) {
      navigator.share({ title: 'Precalc progress', text: 'My precalc check-up', url: url })
               .catch(() => {});
    } else if (typeof navigator !== 'undefined' && navigator.clipboard) {
      navigator.clipboard.writeText(url);
      b.textContent = 'Link copied ✓';
    }
  };
  a.appendChild(b);
  const ta = el('textarea'); ta.value = url; ta.readOnly = true;
  a.appendChild(el('h3', '', 'Or copy this'));
  a.appendChild(ta);
  renderNav();
}

/* ---------- tutor dashboard ---------- */
function viewTutor() {
  const a = clear();
  renderNav();
  const hash = (typeof location !== 'undefined' ? location.hash : '');
  const m = hash.match(/[?&]d=([A-Za-z0-9\-_]+)/);
  let imported = null;
  if (m) {
    try { imported = decodeShare(m[1]); } catch (e) { imported = { error: e.message }; }
  }
  if (imported && imported.error) {
    a.appendChild(el('div', 'card', '<p>Could not read that code: ' + esc(imported.error) + '</p>'));
    return;
  }
  if (imported) { S = imported.state; VIEWING_IMPORT = true; }
  else if (!sessionUnlocked()) { return renderGate(a); }

  const st = processStats();
  a.appendChild(el('h1', '', 'Tutor view — ' + esc(S.name)));
  if (!st) { a.appendChild(el('p', 'muted', 'No attempts in this record.')); return; }
  if (imported && imported.stale) {
    a.appendChild(el('div', 'card', '<p class="small">⚠️ This code came from a ' +
      'different build of the question bank. Item text may not line up.</p>'));
  }
  a.appendChild(el('p', 'muted small',
    st.n + ' questions · ' + st.correct + ' correct (' + st.pct + '%) · ' +
    st.totalMin + ' min · ' + new Date(S.created).toLocaleDateString()));

  /* --- the agenda: what to actually do --- */
  a.appendChild(el('h2', '', 'Session agenda'));
  const ag = agenda();
  if (!ag.length) a.appendChild(el('p', 'muted small', 'Nothing flagged.'));
  ag.forEach((g, i) => {
    const c = el('div', 'card flag');
    c.style.setProperty('--c', g.kind === 'calib' ? '#f2607a'
                              : g.kind === 'family' ? '#a97bf0' : '#f0a93f');
    let h = '<h2 style="margin-top:0">' + (i + 1) + '. ' + esc(g.title) + '</h2>' +
            '<p class="small">' + esc(g.why) + '</p>' +
            '<p class="small muted"><b>How:</b> ' + esc(g.how) + '</p>';
    if (g.probes && g.probes.length) {
      h += '<h3>Probes</h3><ul class="steps small">' +
           g.probes.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>';
    }
    c.innerHTML = h;
    a.appendChild(c);
  });

  /* --- calibration 2x2 --- */
  const cal = calibration();
  a.appendChild(el('h2', '', 'Confidence vs correctness'));
  a.appendChild(el('p', 'small muted', 'The top-right cell is the one a grade cannot show you.'));
  const g = el('div', 'grid2');
  [['Confident + right', cal.confRight.length, '#3ecf8e', 'Mastered. Stop spending time here.'],
   ['Confident + WRONG', cal.confWrong.length, '#f2607a', 'Misconception. She will resist correction.'],
   ['Unsure + right', cal.unsureRight.length, '#f0a93f', 'Fragile. Knows it, does not trust it.'],
   ['Unsure + wrong', cal.unsureWrong.length, '#8fa0bd', 'Clean gap. Nothing to unlearn.']]
    .forEach(([label, n, col, note]) => {
      const q = el('div', 'q2');
      q.innerHTML = '<div class="n" style="color:' + col + '">' + n + '</div>' +
                    '<div class="l"><b>' + esc(label) + '</b><br>' + esc(note) + '</div>';
      g.appendChild(q);
    });
  a.appendChild(g);

  /* --- error families --- */
  const fams = familyFindings();
  if (fams.length) {
    a.appendChild(el('h2', '', 'Error patterns'));
    fams.forEach(f => {
      const c = el('div', 'card');
      c.innerHTML = '<h2 style="margin-top:0">' + esc(f.name) + '</h2>' +
        '<p class="small muted">' + esc(f.summary) + '</p>' +
        '<p class="small"><b>' + f.count + ' error' + (f.count === 1 ? '' : 's') +
        '</b> across <b>' + f.spread + '</b> topic' + (f.spread === 1 ? '' : 's') + '.</p>' +
        f.misconceptions.map(mm =>
          '<div class="card tight" style="margin:9px 0 0;background:#1d2438">' +
          '<p class="small" style="margin:0 0 4px"><b>' + esc(mm.m.name) + '</b> ×' + mm.n +
          '</p><p class="tiny muted" style="margin:0 0 4px"><code>' + esc(mm.m.signature) +
          '</code></p><p class="tiny muted" style="margin:0">Probe: ' + esc(mm.m.probe) +
          '</p></div>').join('') +
        '<p class="small" style="margin-top:11px"><b>Fix:</b> ' + esc(f.fix) + '</p>';
      a.appendChild(c);
    });
  }

  /* --- root causes --- */
  const roots = rootCauses();
  if (roots.length) {
    a.appendChild(el('h2', '', 'Root causes'));
    a.appendChild(el('p', 'small muted',
      'Failed, with nothing broken beneath them. Everything above is downstream.'));
    roots.forEach(r => {
      const c = el('div', 'card tight');
      c.innerHTML = '<p style="margin:0 0 4px"><b>' + esc(r.name) + '</b> ' +
        '<span class="pill">' + (r.tier === 0 ? 'algebra substrate' : 'precalc') + '</span>' +
        '<span class="pill">' + r.evidence + ' item' + (r.evidence === 1 ? '' : 's') + '</span></p>' +
        '<p class="small muted" style="margin:0">' + esc(r.blurb) + '</p>' +
        (r.blockedFailing.length
          ? '<p class="tiny" style="margin:6px 0 0">Blocks: ' +
            esc(r.blockedFailing.map(b => KC_BY_ID[b].name).join(', ')) + '</p>' : '');
      a.appendChild(c);
    });
  }

  /* --- how she works --- */
  a.appendChild(el('h2', '', 'How she works'));
  const proc = el('div', 'card');
  proc.innerHTML =
    kv('Median time per question', st.medianSec + 's') +
    kv('Median reading time before first tap', st.medianReadSec + 's') +
    kv('Median time when right', st.medianRightSec + 's') +
    kv('Median time when wrong', st.medianWrongSec + 's') +
    kv('Fast misses (under 60% of median)', st.fastWrong +
       (st.fastWrong ? ' — pattern-matching, not reading' : '')) +
    kv('Slow misses (over 150% of median)', st.slowWrong +
       (st.slowWrong ? ' — method missing, not carelessness' : '')) +
    kv('Nudges opened', String(st.hints)) +
    kv('Answer changes', String(st.changes)) +
    kv('Changed right → wrong', st.changedToWrong +
       (st.changedToWrong ? ' — second-guessing costs her' : '')) +
    kv('Changed wrong → right', String(st.changedToRight));
  a.appendChild(proc);

  /* --- raw log --- */
  a.appendChild(el('h2', '', 'Every answer'));
  const tbl = el('table');
  tbl.innerHTML = '<tr><th>#</th><th>Topic</th><th>Sure?</th><th>Time</th><th>Result</th></tr>' +
    S.attempts.map((x, i) =>
      '<tr><td>' + (i + 1) + '</td><td>' + esc((KC_BY_ID[x.kc] || {}).name || x.kc) + '</td>' +
      '<td>' + esc(x.conf) + '</td><td>' + Math.round(x.msTotal / 1000) + 's</td>' +
      '<td>' + (x.correct ? '✅' : '❌' + (x.mis && MIS[x.mis]
        ? ' <span class="tiny muted">' + esc(MIS[x.mis].name) + '</span>' : '')) +
      '</td></tr>').join('');
  a.appendChild(tbl);

  const back = el('button', 'btn-ghost', 'Back');
  back.onclick = () => { VIEWING_IMPORT = false; load(); go('#/'); };
  a.appendChild(back);
}

function kv(k, v) {
  return '<div class="kv"><span class="small muted">' + esc(k) + '</span><b class="small">' +
         esc(v) + '</b></div>';
}

let _unlocked = false;
function sessionUnlocked() { return _unlocked; }
function renderGate(a) {
  a.appendChild(el('h1', '', 'Tutor view'));
  a.appendChild(el('p', 'muted small',
    'Kaleice’s own results live under Results. This view is the clinical one.'));
  const inp = document.createElement('input');
  inp.type = 'password'; inp.placeholder = 'code';
  a.appendChild(inp);
  const b = el('button', 'btn-primary', 'Open');
  b.style.marginTop = '10px';
  b.onclick = () => {
    if (inp.value === TUTOR_CODE) { _unlocked = true; render(); }
    else { inp.value = ''; inp.placeholder = 'nope'; }
  };
  a.appendChild(b);
  const back = el('button', 'btn-ghost', 'Back');
  back.onclick = () => go('#/');
  a.appendChild(back);
}

/* ---------- router ---------- */
function render() {
  const h = (typeof location !== 'undefined' ? location.hash : route) || '#/';
  route = h.split('?')[0];
  if (route.indexOf('#/diagnostic') === 0) return viewDiagnostic();
  if (route.indexOf('#/results') === 0) return viewResults();
  if (route.indexOf('#/practice') === 0) return viewPractice();
  if (route.indexOf('#/share') === 0) return viewShare();
  if (h.indexOf('#/tutor') === 0) return viewTutor();
  return viewHome();
}

if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('hashchange', render);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
}
load();
render();
</script>
</body>
</html>
