<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141f">
<title>Precalc 1113</title>
<link rel="manifest" href="./manifest.webmanifest">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#10141f;color:#e8edf7;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:0 0 env(safe-area-inset-bottom);
  overflow-wrap:break-word;
}
#app{max-width:640px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:24px;line-height:1.25;margin:0 0 6px}
h2{font-size:19px;line-height:1.3;margin:26px 0 10px}
h3{font-size:15px;margin:18px 0 8px;color:#9fb0cc;text-transform:uppercase;letter-spacing:.06em}
p{margin:0 0 12px}
.muted{color:#8fa0bd}
.small{font-size:13.5px}
.tiny{font-size:12px}
math{font-size:1.06em}

/* ---------- cards ---------- */
.card{background:#182034;border:1px solid #26314c;border-radius:14px;padding:16px;margin:0 0 14px}
.card.tight{padding:13px}
.flag{border-left:4px solid var(--c,#3fa9f5)}

/* ---------- buttons ---------- */
button{font:inherit;color:inherit;cursor:pointer;border-radius:12px;border:1px solid #2f3b59;
  background:#1e2740;padding:13px 16px;width:100%;text-align:left;margin:0 0 9px;
  transition:background .12s,border-color .12s}
button:active{background:#26304e}
button[disabled]{opacity:.55;cursor:default}
.btn-primary{background:#2f7ff0;border-color:#2f7ff0;color:#fff;text-align:center;font-weight:600}
.btn-primary:active{background:#2569c8}
.btn-ghost{background:transparent;border-color:#33405f;text-align:center}
.row{display:flex;gap:9px}
.row>button{margin-bottom:9px}

/* ---------- options ---------- */
.opt{display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.opt .k{flex:0 0 25px;height:25px;border-radius:7px;background:#2b3550;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;color:#a9bcdc;margin-top:1px}
.opt .t{flex:1;min-width:0}
button.right{border-color:#3ecf8e;background:#16342a}
button.right .k{background:#3ecf8e;color:#08120e}
button.wrong{border-color:#f2607a;background:#341a22}
button.wrong .k{background:#f2607a;color:#2a0910}

/* ---------- confidence ---------- */
.conf{display:flex;gap:8px}
.conf button{text-align:center;padding:11px 6px;font-size:13.5px;line-height:1.35;margin:0}
.conf .e{display:block;font-size:19px;margin-bottom:3px}

/* ---------- progress ---------- */
.bar{height:7px;background:#232d47;border-radius:99px;overflow:hidden;margin:0 0 16px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f7ff0,#49d6c0);
  border-radius:99px;transition:width .35s ease}
.meter{height:6px;background:#232d47;border-radius:99px;overflow:hidden;margin:6px 0 0}
.meter>i{display:block;height:100%;border-radius:99px}

/* ---------- misc ---------- */
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:99px;
  background:#26314c;color:#a9bcdc;margin:0 6px 6px 0;white-space:nowrap}
.pill.warn{background:#4a2230;color:#ffc0cd}
.pill.good{background:#183a2e;color:#8ff0c4}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #232d47}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.steps{margin:8px 0 0;padding:0 0 0 18px}
.steps li{margin:0 0 5px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 6px;border-bottom:1px solid #232d47;text-align:left;vertical-align:top}
th{color:#8fa0bd;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
code{background:#232d47;padding:2px 6px;border-radius:6px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.q2{border:1px solid #26314c;border-radius:11px;padding:11px}
.q2 .n{font-size:23px;font-weight:700;line-height:1}
.q2 .l{font-size:11.5px;color:#8fa0bd;margin-top:3px;line-height:1.35}
.nav{position:fixed;left:0;right:0;bottom:0;background:#131a2b;border-top:1px solid #26314c;
  display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;margin:0;background:transparent;border:0;text-align:center;padding:7px 3px;
  font-size:11px;color:#8fa0bd;border-radius:9px}
.nav button.on{color:#6fb2ff;background:#1b2640}
.nav .i{display:block;font-size:17px;margin-bottom:2px}
.hidden{display:none !important}
textarea{width:100%;min-height:110px;background:#131a2b;color:#e8edf7;border:1px solid #2f3b59;
  border-radius:11px;padding:11px;font:13px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
input[type=password],input[type=text]{width:100%;background:#131a2b;color:#e8edf7;
  border:1px solid #2f3b59;border-radius:11px;padding:13px;font:inherit}
</style>
</head>
<body>
<div id="app"></div>
<div class="nav hidden" id="nav"></div>
<script>
/* =====================================================================
 * Precalc 1113 -- diagnostic + practice PWA
 *
 * One inline script, no runtime dependencies. Math arrives as MathML that
 * was rendered at build time, so there is no KaTeX, no web font and no CDN
 * to fail on a bad connection.
 * ===================================================================== */
const DATA = /*__DATA__*/;
const KCS = DATA.kcs, ITEMS = DATA.items, MIS = DATA.misconceptions, FAM = DATA.families;
const KC_BY_ID = {}; KCS.forEach(k => KC_BY_ID[k.id] = k);
const ITEMS_BY_KC = {}; ITEMS.forEach(it => (ITEMS_BY_KC[it.kc] = ITEMS_BY_KC[it.kc] || []).push(it));
const ITEM_BY_ID = {}; ITEMS.forEach(it => ITEM_BY_ID[it.id] = it);
const ANCHORS = KCS.filter(k => k.anchor && (ITEMS_BY_KC[k.id] || []).length).map(k => k.id);

const KEY = 'precalc1113.v1';
// Deliberately empty in the shipped build: this repo is public, so her name is
// never in it. She is asked once and the answer stays in her own storage.
const STUDENT = DATA.student || '';
const TUTOR_CODE = DATA.tutorCode || 'tutor';
const DIAG_CAP = 32;          // hard ceiling on diagnostic length
const DIAG_TARGET = 26;       // where we aim to stop

/* ---------------------------------------------------------------------
 * Learning engine -- ported from an existing Python learning module (BKT + review priority)
 * ------------------------------------------------------------------- */
const BKT_L0 = 0.30, BKT_T = 0.35, BKT_SLIP = 0.10, BKT_GUESS = 0.25;
const TAU_HOURS = 48.0;
const CONF_VALUE = { guessing: 0.20, shaky: 0.55, confident: 0.88 };

function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

function bktUpdate(pL, correct) {
  pL = clamp(pL, 0, 1);
  const s = BKT_SLIP, g = BKT_GUESS;
  let num, den;
  if (correct) { num = pL * (1 - s); den = num + (1 - pL) * g; }
  else { num = pL * s; den = num + (1 - pL) * (1 - g); }
  const post = den > 0 ? num / den : pL;
  return clamp(post + (1 - post) * BKT_T, 0, 1);
}

function displayedProficiency(pL, hoursStale) {
  return clamp(pL, 0, 1) * Math.exp(-Math.max(0, hoursStale) / TAU_HOURS);
}

function reviewPriority(conf, correct, box) {
  const c = clamp(conf, 0, 1), wrong = correct ? 0 : 1;
  const miscal = Math.abs(c - (correct ? 1 : 0));
  return 4 * c * wrong + 1.5 * miscal + (box === 1 ? 1 : 0);
}

function prereqClosure(kcId) {
  /* Every KC this one transitively needs, deepest-first. Drives the descent. */
  const seen = {}, order = [];
  (function visit(n) {
    const k = KC_BY_ID[n]; if (!k) return;
    k.prereqs.forEach(p => { if (!seen[p]) { seen[p] = 1; visit(p); order.push(p); } });
  })(kcId);
  return order;
}

/* ---------------------------------------------------------------------
 * State
 * ------------------------------------------------------------------- */
function blank() {
  return {
    v: 1, created: Date.now(), name: STUDENT,
    diag: { started: 0, finished: 0, plan: [], idx: 0, desc: [], didx: 0, asked: [] },
    attempts: [],       // the raw log; everything else is derived from it
    kc: {},             // kcId -> {pL, n, ok, lastOk}
    practice: { box: {} },
  };
}
let S = blank();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const p = JSON.parse(raw); if (p && p.v === 1) S = p; }
  } catch (e) { /* corrupt or unavailable storage must not brick the app */ }
  return S;
}
/* When the tutor opens a shared link, S is replaced by HER session. Any save()
 * after that would overwrite whatever is on HIS device, so saving is disabled
 * for as long as an imported session is on screen. */
let VIEWING_IMPORT = false;
function save() {
  if (VIEWING_IMPORT) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

function kcState(id) {
  if (!S.kc[id]) S.kc[id] = { pL: BKT_L0, n: 0, ok: 0, lastOk: 0 };
  return S.kc[id];
}
function tested(id) { return (S.kc[id] || { n: 0 }).n > 0; }
function kcPassed(id) { const k = S.kc[id]; return !!k && k.n > 0 && k.ok >= Math.ceil(k.n / 2); }

/* ---------------------------------------------------------------------
 * Item selection
 * ------------------------------------------------------------------- */
function pickItem(kcId, wantDiff) {
  const pool = (ITEMS_BY_KC[kcId] || []).filter(it => S.diag.asked.indexOf(it.id) < 0);
  if (!pool.length) return null;
  let best = pool[0], bestD = 1e9;
  for (const it of pool) {
    const d = Math.abs((it.difficulty || 3) - wantDiff);
    if (d < bestD) { bestD = d; best = it; }
  }
  return best;
}

/* ---------------------------------------------------------------------
 * The adaptive descent -- BREADTH FIRST, THEN DEPTH.
 *
 * Phase 1 asks every anchor once. That guarantees the report covers the whole
 * course: if descents were spliced in inline, a student who struggled early
 * would burn the question budget in chapter 1 and the report would silently
 * say nothing at all about trigonometry.
 *
 * Phase 2 spends whatever budget is left descending into the anchors that
 * failed, walking each prerequisite closure DEEPEST-FIRST and stopping that
 * branch at the first prerequisite that also fails -- that one is the root
 * cause, and everything above it is collateral damage.
 * ------------------------------------------------------------------- */
function buildPlan() {
  const byChapter = ANCHORS.slice().sort((a, b) => {
    const ca = KC_BY_ID[a].chapter, cb = KC_BY_ID[b].chapter;
    const na = ca === 'prereq' ? 0 : parseInt(ca, 10);
    const nb = cb === 'prereq' ? 0 : parseInt(cb, 10);
    return na - nb;
  });
  return byChapter.map(kc => ({ kc: kc, anchor: kc, depth: 0 }));
}

function rootKnownUnder(kcId) {
  /* Is something beneath this KC already known to be broken? If so we already
     have the explanation and digging further just re-confirms it. */
  return prereqClosure(kcId).some(p => tested(p) && !kcPassed(p));
}

function queueDescent(anchorKc) {
  const d = S.diag;
  const have = {};
  d.desc.forEach(e => { have[e.kc] = 1; });
  prereqClosure(anchorKc).forEach(p => {          // already deepest-first
    if (!have[p] && !tested(p) && (ITEMS_BY_KC[p] || []).length) {
      d.desc.push({ kc: p, anchor: anchorKc, depth: 1 });
    }
  });
}

function nextEntry() {
  const d = S.diag;
  if (d.asked.length >= DIAG_CAP) return null;
  // Phase 1 -- every anchor, so the report covers the whole course.
  while (d.idx < d.plan.length) {
    const e = d.plan[d.idx];
    if (tested(e.kc) || !(ITEMS_BY_KC[e.kc] || []).length) { d.idx++; continue; }
    return e;
  }
  // Phase 2 -- descend into what failed, with whatever budget is left.
  while (d.didx < d.desc.length) {
    const e = d.desc[d.didx];
    if (tested(e.kc) || !(ITEMS_BY_KC[e.kc] || []).length) { d.didx++; continue; }
    if (rootKnownUnder(e.anchor)) { d.didx++; continue; }
    return e;
  }
  return null;
}

function onDiagnosticResult(entry, correct) {
  const d = S.diag;
  if (entry.depth === 0) {
    d.idx++;
    if (!correct && !rootKnownUnder(entry.kc)) queueDescent(entry.kc);
  } else {
    // A failed prerequisite is the root for that branch; nextEntry's
    // rootKnownUnder guard stops the rest of that anchor's descent.
    d.didx++;
  }
}

/* ---------------------------------------------------------------------
 * Recording an attempt -- this is the telemetry that makes the app useful
 * ------------------------------------------------------------------- */
function record(a) {
  S.attempts.push(a);
  const k = kcState(a.kc);
  k.pL = bktUpdate(k.pL, a.correct);
  k.n += 1;
  if (a.correct) { k.ok += 1; k.lastOk = a.ts; }
  save();
}

/* ---------------------------------------------------------------------
 * Analysis -- everything the tutor dashboard reports is derived here
 * ------------------------------------------------------------------- */
function rootCauses() {
  /* KCs that failed and have no failing prerequisite beneath them.
     Those are the things worth teaching; everything above is downstream. */
  const failed = KCS.filter(k => tested(k.id) && !kcPassed(k.id)).map(k => k.id);
  const fset = {}; failed.forEach(f => fset[f] = 1);
  const roots = failed.filter(f => !prereqClosure(f).some(p => fset[p]));
  return roots.map(id => {
    const blocks = KCS.filter(k => k.id !== id && prereqClosure(k.id).indexOf(id) >= 0)
                      .map(k => k.id);
    return {
      kc: id,
      name: KC_BY_ID[id].name,
      tier: KC_BY_ID[id].tier,
      blurb: KC_BY_ID[id].blurb,
      blocks: blocks,
      blockedFailing: blocks.filter(b => tested(b) && !kcPassed(b)),
      evidence: (S.kc[id] || {}).n || 0,
    };
  }).sort((a, b) => b.blocks.length - a.blocks.length);
}

function familyFindings() {
  /* Group her actual errors by the belief behind them. One bug, N places. */
  const hits = {};
  S.attempts.forEach(a => {
    if (a.correct || !a.mis || !MIS[a.mis]) return;
    const f = MIS[a.mis].family;
    if (!hits[f]) hits[f] = { family: f, count: 0, mis: {}, kcs: {} };
    hits[f].count++;
    hits[f].mis[a.mis] = (hits[f].mis[a.mis] || 0) + 1;
    hits[f].kcs[a.kc] = 1;
  });
  return Object.keys(hits).map(f => ({
    family: f,
    name: FAM[f].name,
    summary: FAM[f].summary,
    fix: FAM[f].fix,
    count: hits[f].count,
    spread: Object.keys(hits[f].kcs).length,
    misconceptions: Object.keys(hits[f].mis)
      .sort((a, b) => hits[f].mis[b] - hits[f].mis[a])
      .map(id => ({ id: id, n: hits[f].mis[id], m: MIS[id] })),
  })).sort((a, b) => (b.spread - a.spread) || (b.count - a.count));
}

function calibration() {
  const box = { confWrong: [], confRight: [], unsureRight: [], unsureWrong: [] };
  S.attempts.forEach(a => {
    const c = CONF_VALUE[a.conf] >= 0.8;
    if (c && a.correct) box.confRight.push(a);
    else if (c && !a.correct) box.confWrong.push(a);
    else if (!c && a.correct) box.unsureRight.push(a);
    else box.unsureWrong.push(a);
  });
  return box;
}

function median(xs) {
  if (!xs.length) return 0;
  const s = xs.slice().sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
}

function processStats() {
  const A = S.attempts;
  if (!A.length) return null;
  const right = A.filter(a => a.correct), wrong = A.filter(a => !a.correct);
  const medAll = median(A.map(a => a.msTotal));
  const fastWrong = wrong.filter(a => a.msTotal < medAll * 0.6).length;
  const slowWrong = wrong.filter(a => a.msTotal > medAll * 1.5).length;
  return {
    n: A.length,
    correct: right.length,
    pct: Math.round(100 * right.length / A.length),
    medianSec: Math.round(medAll / 1000),
    medianReadSec: Math.round(median(A.map(a => a.msFirst)) / 1000),
    medianRightSec: Math.round(median(right.map(a => a.msTotal)) / 1000),
    medianWrongSec: Math.round(median(wrong.map(a => a.msTotal)) / 1000),
    fastWrong: fastWrong,
    slowWrong: slowWrong,
    hints: A.filter(a => a.hint).length,
    changes: A.reduce((n, a) => n + (a.changes || 0), 0),
    changedToWrong: A.filter(a => a.chFromCorrect).length,
    changedToRight: A.filter(a => a.chToCorrect).length,
    totalMin: Math.round(A.reduce((n, a) => n + a.msTotal, 0) / 60000),
  };
}

function agenda() {
  /* The ordered thing to actually do in the next session. */
  const out = [];
  familyFindings().slice(0, 2).forEach(f => out.push({
    kind: 'family', title: f.name,
    why: 'Showed up in ' + f.spread + ' different topic' + (f.spread === 1 ? '' : 's') +
         ' (' + f.count + ' error' + (f.count === 1 ? '' : 's') + '). Fixing the belief fixes all of them.',
    how: f.fix,
    probes: f.misconceptions.slice(0, 3).map(m => m.m.probe),
  }));
  rootCauses().slice(0, 3).forEach(r => out.push({
    kind: 'root', title: r.name,
    why: r.blockedFailing.length
      ? 'Underneath ' + r.blockedFailing.length + ' other thing' +
        (r.blockedFailing.length === 1 ? '' : 's') + ' she missed: ' +
        r.blockedFailing.slice(0, 3).map(b => KC_BY_ID[b].name).join(', ') + '.'
      : 'Missed directly, with nothing broken beneath it.',
    how: r.blurb,
    probes: [],
  }));
  const cw = calibration().confWrong;
  if (cw.length) out.unshift({
    kind: 'calib', title: 'Confident and wrong (' + cw.length + ')',
    why: 'She does not know these are wrong, so she will not ask about them. They are also the ' +
         'most correctable: being surprised by an error makes it stick.',
    how: 'Open with these. Ask her to explain the method BEFORE saying anything about right or wrong.',
    probes: cw.slice(0, 4).map(a => (ITEM_BY_ID[a.id] || {}).plain || a.kc),
  });
  return out;
}

/* ---------------------------------------------------------------------
 * Share payload -- her device to his device, never through a server.
 * Pure base64url of compact JSON; no browser API so it is testable offline.
 * ------------------------------------------------------------------- */
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function toB64u(str) {
  const b = []; for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    if (c < 128) b.push(c);
    else if (c < 2048) { b.push(192 | (c >> 6), 128 | (c & 63)); }
    else { b.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); }
  }
  let out = '';
  for (let i = 0; i < b.length; i += 3) {
    const n = (b[i] << 16) | ((b[i + 1] || 0) << 8) | (b[i + 2] || 0);
    out += B64[(n >> 18) & 63] + B64[(n >> 12) & 63];
    out += i + 1 < b.length ? B64[(n >> 6) & 63] : '';
    out += i + 2 < b.length ? B64[n & 63] : '';
  }
  return out;
}
function fromB64u(s) {
  const b = [];
  for (let i = 0; i < s.length; i += 4) {
    const n = (B64.indexOf(s[i]) << 18) | (B64.indexOf(s[i + 1]) << 12) |
              ((s[i + 2] ? B64.indexOf(s[i + 2]) : 0) << 6) | (s[i + 3] ? B64.indexOf(s[i + 3]) : 0);
    b.push((n >> 16) & 255);
    if (s[i + 2]) b.push((n >> 8) & 255);
    if (s[i + 3]) b.push(n & 255);
  }
  let out = '';
  for (let i = 0; i < b.length; i++) {
    const c = b[i];
    if (c < 128) out += String.fromCharCode(c);
    else if (c < 224) { out += String.fromCharCode(((c & 31) << 6) | (b[++i] & 63)); }
    else { out += String.fromCharCode(((c & 15) << 12) | ((b[++i] & 63) << 6) | (b[++i] & 63)); }
  }
  return out;
}
function packSession() {
  return {
    v: 1, b: DATA.serial, n: S.name, c: S.created, f: S.diag.finished,
    a: S.attempts.map(a => [a.id, a.kc, a.correct ? 1 : 0, a.mis || '', a.conf,
                            a.msFirst, a.msTotal, a.changes || 0,
                            a.chFromCorrect ? 1 : 0, a.hint ? 1 : 0, a.ts]),
  };
}
function encodeShare() { return toB64u(JSON.stringify(packSession())); }
function decodeShare(code) {
  const p = JSON.parse(fromB64u(code.trim()));
  if (!p || p.v !== 1 || !Array.isArray(p.a)) throw new Error('not a Precalc 1113 code');
  const st = blank();
  st.name = p.n; st.created = p.c; st.diag.finished = p.f;
  st.attempts = p.a.map(r => ({
    id: r[0], kc: r[1], correct: !!r[2], mis: r[3] || null, conf: r[4],
    msFirst: r[5], msTotal: r[6], changes: r[7], chFromCorrect: !!r[8],
    hint: !!r[9], ts: r[10],
  }));
  st.attempts.forEach(a => {
    if (!st.kc[a.kc]) st.kc[a.kc] = { pL: BKT_L0, n: 0, ok: 0, lastOk: 0 };
    const k = st.kc[a.kc];
    k.pL = bktUpdate(k.pL, a.correct); k.n++; if (a.correct) { k.ok++; k.lastOk = a.ts; }
  });
  // So a session carried across from Safari does not re-serve questions she
  // has already answered.
  st.diag.asked = st.attempts.map(a => a.id);
  return { state: st, stale: p.b !== DATA.serial };
}

/* =====================================================================
 * Rendering
 * ===================================================================== */
const app = () => document.getElementById('app');
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function clear() { const a = app(); a.innerHTML = ''; return a; }

let route = '';

/* ---------------------------------------------------------------------
 * Installing on iPhone
 *
 * Two iOS behaviours make this worth doing properly rather than in a README:
 *
 * 1. A home-screen web app on iOS gets its OWN storage container. localStorage
 *    is NOT shared with Safari. So if she works through the check-up in Safari
 *    and installs afterwards, the installed app opens completely empty and her
 *    answers are stranded in the browser. Hence: install FIRST, and a way to
 *    carry progress across if she did not.
 * 2. "Add to Home Screen" does not appear in in-app browsers -- and tapping a
 *    texted link opens exactly that. She has to get into real Safari first,
 *    which she has no reason to know.
 * ------------------------------------------------------------------- */
function ua() {
  return (typeof navigator !== 'undefined' && navigator.userAgent) || '';
}
function isIOS() {
  return /iPad|iPhone|iPod/.test(ua());
}
function isStandalone() {
  if (typeof navigator !== 'undefined' && navigator.standalone === true) return true;
  return typeof window !== 'undefined' && window.matchMedia
    ? window.matchMedia('(display-mode: standalone)').matches : false;
}
function isInAppBrowser() {
  // Real Safari reports both "Version/" and "Safari/". Embedded WKWebViews
  // (Messages, Mail, Instagram) generally do not.
  return isIOS() && !(/Safari\//.test(ua()) && /Version\//.test(ua()));
}

const SHARE_SVG =
  '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" ' +
  'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ' +
  'style="vertical-align:-5px">' +
  '<path d="M8.5 11H6.6A1.6 1.6 0 0 0 5 12.6v6.8A1.6 1.6 0 0 0 6.6 21h10.8a1.6 1.6 0 0 0 ' +
  '1.6-1.6v-6.8A1.6 1.6 0 0 0 17.4 11H15.5"/>' +
  '<path d="M12 3v11"/><path d="M8.6 6.4 12 3l3.4 3.4"/></svg>';

function step(n, html) {
  return '<div style="display:flex;gap:12px;margin:0 0 15px">' +
    '<div style="flex:0 0 26px;height:26px;border-radius:99px;background:#2f7ff0;color:#fff;' +
    'display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">' +
    n + '</div><div style="flex:1;min-width:0;padding-top:2px">' + html + '</div></div>';
}

      '<p class="small">You’re in the mini browser inside another app (Messages, Mail, ' +
      'Instagram — whatever you tapped the link from). It <b>cannot</b> add things to your ' +
      'Home Screen, and the button simply won’t be there.</p>' +
      step(1, 'Look for the <b>compass icon</b> ' +
              '<span style="color:#6fb2ff">◎</span> — usually bottom-right. Tap it.') +
      step(2, 'Or tap ' + SHARE_SVG + ' and choose <b>Open in Safari</b>.') +
      '<p class="small muted" style="margin:6px 0 0">Once Safari opens, come back to this ' +
      'page and the steps below will work.</p>';
    a.appendChild(c);
  }

  const c = el('div', 'card');
  c.innerHTML = '<h2 style="margin-top:0">In Safari</h2>' +
    step(1, 'Tap the <b>Share</b> button ' + SHARE_SVG + ' — a square with an arrow ' +
            'pointing up out of it. It sits in the <b>bar at the bottom</b> of the screen, ' +
            'in the middle.') +
    step(2, 'A panel slides up. <b>Scroll down</b> past the row of apps and past ' +
            '<i>Add Bookmark</i>.') +
    step(3, 'Tap <b>Add to Home Screen</b>. Its icon is a square with a <b>+</b> in it.') +
    step(4, 'Tap <b>Add</b> in the top-right corner. You can leave the name as ' +
            '<b>Precalc</b>.') +
    step(5, 'Leave Safari and open <b>Precalc</b> from your Home Screen. It opens full ' +
            'screen with no address bar — that’s how you know it worked.');
  a.appendChild(c);

  const t = el('div', 'card tight');
  t.innerHTML = '<p class="small" style="margin:0 0 8px"><b>Don’t see “Add to Home Screen”?</b></p>' +
    '<p class="small muted" style="margin:0 0 6px">Scroll further — it sits well down the ' +
    'list, below the sharing options.</p>' +
    '<p class="small muted" style="margin:0">Still missing: scroll to the very bottom of that ' +
    'panel, tap <b>Edit Actions…</b>, find <b>Add to Home Screen</b> and tap the green ' +
    '<b>+</b> next to it. Then go back and it will be there.</p>';
  a.appendChild(t);

  a.appendChild(restoreBlock());

  const skip = el('button', 'btn-ghost', S.name ? 'Back' : 'Skip — just use it in the browser');
  skip.onclick = () => { S.skipInstall = 1; save(); go('#/'); };
  a.appendChild(skip);
}

/* Carry a Safari session into the installed app (or the reverse). iOS keeps the
   two storages apart, so this is the only bridge -- a code she copies across. */
function restoreBlock() {
  const wrap = el('div', 'card');
  const n = S.attempts.length;
  let h = '<h2 style="margin-top:0">Moving answers across</h2>';

  if (n) {
    h += '<p class="small">You’ve already answered <b>' + n + '</b> question' +
         (n === 1 ? '' : 's') + ' here. Copy this code, open the installed app, and paste it ' +
         'in the same box there — nothing gets lost.</p>';
  } else {
    h += '<p class="small muted">If you already answered some questions somewhere else, paste ' +
         'that code here to bring them over.</p>';
  }
  wrap.innerHTML = h;

  if (n) {
    const copy = el('button', '', 'Copy my progress code');
    copy.onclick = () => {
      const code = encodeShare();
      if (typeof navigator !== 'undefined' && navigator.clipboard) {
        navigator.clipboard.writeText(code).then(
          () => { copy.textContent = 'Copied ✓'; },
          () => { box.value = code; copy.textContent = 'Copy it from the box below'; });
      } else { box.value = code; copy.textContent = 'Copy it from the box below'; }
    };
    wrap.appendChild(copy);
  }

  const box = document.createElement('textarea');
  box.setAttribute('placeholder', 'Paste your progress code here');
  wrap.appendChild(box);
  const go2 = el('button', '', 'Bring my answers over');
  go2.onclick = () => {
    const v = String(box.value || '').trim();
    if (!v) return;
    try {
      const r = decodeShare(v);
      const keepName = S.name;
      S = r.state;
      if (keepName) S.name = keepName;
      S.skipInstall = 1;
      save();
      go2.textContent = 'Brought ' + S.attempts.length + ' answers over ✓';
      setTimeout(() => go('#/'), 400);
    } catch (e) {
      go2.textContent = 'That code didn’t read properly — try copying it again';
    }
  };
  wrap.appendChild(go2);
  return wrap;
}

/* ---------- diagnostic ---------- */
let Q = null;   // {entry, item, t0, tFirst, chosen, changes, conf, chFromCorrect}

function startDiagnostic() {
  if (!S.diag.started) {
    S.diag.started = Date.now();
    S.diag.plan = buildPlan();
    S.diag.idx = 0;
    S.diag.asked = [];
    save();
  }
  go('#/diagnostic');
}

function finishDiagnostic() {
  S.diag.finished = Date.now();
  save();
  go('#/results');
}

function viewDiagnostic() {
  const entry = nextEntry();
  if (!entry) { finishDiagnostic(); return; }
  const kc = KC_BY_ID[entry.kc];
  const item = pickItem(entry.kc, entry.depth === 0 ? 3 : 2);
  if (!item) { S.diag.idx++; save(); viewDiagnostic(); return; }

  Q = { entry: entry, item: item, t0: Date.now(), tFirst: 0, chosen: null,
        changes: 0, conf: null, chFromCorrect: false, hint: false };

  const a = clear();
  const n = S.diag.asked.length + 1;
  // Never let the bar read full while questions remain: past the target the
  // denominator switches to the hard cap, and it tops out at 97%.
  const denom = (n - 1) >= DIAG_TARGET ? DIAG_CAP : DIAG_TARGET;
  const pct = Math.min(97, Math.round(100 * (n - 1) / denom));
  a.appendChild(el('div', 'bar', '<i style="width:' + pct + '%"></i>'));
  a.appendChild(el('div', 'small muted',
    'Question ' + n + (entry.depth ? ' · checking a step further back' : '')));

  const card = el('div', 'card');
  card.appendChild(el('div', '', item.stem));
  a.appendChild(card);

  // The options are on screen from the start, but inert until she has said how
  // sure she is. Confidence must be asked before she ANSWERS, not before she
  // READS -- several items put the whole question in the options ("exactly one
  // of these statements is true"), and asking how confident she feels about
  // statements she cannot see yet is meaningless.
  const optWrap = el('div', '');
  optWrap.appendChild(el('h3', '', 'The options'));
  const btns = [];
  item.options.forEach((o, i) => {
    const b = el('button', '',
      '<span class="opt"><span class="k">' + 'ABCD'[i] + '</span>' +
      '<span class="t">' + o.text + '</span></span>');
    b.disabled = true;
    b.style.opacity = '0.62';
    btns.push(b);
    optWrap.appendChild(b);
  });
  a.appendChild(optWrap);

  const confWrap = el('div', '');
  confWrap.appendChild(el('h3', '', 'Before you answer — how sure are you?'));
  const conf = el('div', 'conf');
  [['guessing', '\u{1F937}', 'No idea'], ['shaky', '\u{1F914}', 'Think so'],
   ['confident', '\u{1F4AA}', 'Got this']].forEach(([v, e, label]) => {
    const b = el('button', '', '<span class="e">' + e + '</span>' + esc(label));
    b.onclick = () => {
      Q.conf = v;
      if (!Q.tFirst) Q.tFirst = Date.now() - Q.t0;
      a.removeChild(confWrap);
      arm();
    };
    conf.appendChild(b);
  });
  confWrap.appendChild(conf);
  a.appendChild(confWrap);

  function arm() {
    optWrap.replaceChild(el('h3', '', 'Your answer'), optWrap.children[0]);
    btns.forEach((b, i) => {
      b.disabled = false;
      b.style.opacity = '1';
      b.onclick = () => {
        const o = item.options[i];
        if (Q.chosen !== null) {
          Q.changes++;
          const prev = item.options[Q.chosen];
          if (prev.correct && !o.correct) Q.chFromCorrect = true;
          if (!prev.correct && o.correct) Q.chToCorrect = true;
        }
        Q.chosen = i;
        btns.forEach((x, j) => { x.style.borderColor = j === i ? '#2f7ff0' : '#2f3b59'; });
        sub.disabled = false;
      };
    });

    const hint = el('button', 'btn-ghost small', 'Give me a nudge');
    hint.onclick = () => {
      Q.hint = true;
      hint.outerHTML = '<div class="card tight small"><b>Nudge:</b> ' + item.hint + '</div>';
    };
    a.appendChild(hint);

    var sub = el('button', 'btn-primary', 'Submit');
    sub.disabled = true;
    sub.onclick = () => submitAnswer();
    a.appendChild(sub);
  }
  renderNav();
}

function submitAnswer() {
  const item = Q.item, o = item.options[Q.chosen];
  const attempt = {
    id: item.id, kc: item.kc, ts: Date.now(), correct: !!o.correct,
    chosen: Q.chosen, mis: o.correct ? null : (o.mis || null), conf: Q.conf,
    msFirst: Q.tFirst, msTotal: Date.now() - Q.t0, changes: Q.changes,
    chFromCorrect: !!Q.chFromCorrect, chToCorrect: !!Q.chToCorrect, hint: Q.hint,
  };
  S.diag.asked.push(item.id);
  record(attempt);
  onDiagnosticResult(Q.entry, attempt.correct);
  save();

  // Thin feedback on purpose: keeps the measurement clean and the pace up.
  // Full explanations are unlocked on the results screen.
  const a = clear();
  a.appendChild(el('div', 'card ' + (attempt.correct ? '' : ''),
    '<h2 style="margin-top:0">' + (attempt.correct ? '✅ Correct' : '❌ Not quite') +
    '</h2>' + (attempt.correct
      ? '<p class="muted small">Nice — moving on.</p>'
      : '<p class="muted small">That’s useful. We’ll come back to this one at the ' +
        'end with the full working.</p>')));
  const b = el('button', 'btn-primary', 'Next question');
  b.onclick = () => {
    if (!nextEntry() || S.diag.asked.length >= DIAG_CAP) finishDiagnostic();
    else viewDiagnostic();
  };
  a.appendChild(b);
  if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
}

/* ---------- results (student-facing) ---------- */
function viewResults() {
  const a = clear();
  const st = processStats();
  if (!st) { a.appendChild(el('p', 'muted', 'No results yet.')); renderNav(); return; }

  a.appendChild(el('h1', '', 'What to work on'));

  const strong = KCS.filter(k => tested(k.id) && kcPassed(k.id));
  if (strong.length) {
    a.appendChild(el('div', 'card flag', '<h3 style="margin-top:0">Solid ✅</h3>' +
      '<p class="small muted">These held up. Don’t spend practice time here.</p>' +
      strong.map(k => '<span class="pill good">' + esc(k.name) + '</span>').join('')));
    a.lastChild.style.setProperty('--c', '#3ecf8e');
  }

  const roots = rootCauses();
  if (roots.length) {
    a.appendChild(el('h2', '', 'Start here'));
    a.appendChild(el('p', 'small muted',
      'These are the <b>underneath</b> things. Other questions went wrong because of them, ' +
      'so fixing these fixes more than one topic at a time.'));
    roots.slice(0, 3).forEach((r, i) => {
      const c = el('div', 'card flag');
      c.style.setProperty('--c', '#f0a93f');
      c.innerHTML = '<h2 style="margin-top:0">' + (i + 1) + '. ' + esc(r.name) + '</h2>' +
        '<p class="small">' + esc(r.blurb) + '</p>' +
        (r.blockedFailing.length
          ? '<p class="small muted">This one is underneath <b>' + r.blockedFailing.length +
            '</b> other question' + (r.blockedFailing.length === 1 ? '' : 's') +
            ' you missed.</p>' : '');
      a.appendChild(c);
    });
  }

  const missed = S.attempts.filter(x => !x.correct);
  if (missed.length) {
    a.appendChild(el('h2', '', 'Review what you missed (' + missed.length + ')'));
    missed.forEach(at => {
      const it = ITEM_BY_ID[at.id]; if (!it) return;
      const c = el('div', 'card');
      let h = '<div>' + it.stem + '</div>';
      const chosen = it.options[at.chosen], right = it.options.filter(o => o.correct)[0];
      h += '<p class="small" style="margin-top:12px"><span class="pill warn">You said</span> ' +
           (chosen ? chosen.text : '') + '</p>';
      h += '<p class="small"><span class="pill good">Answer</span> ' +
           (right ? right.text : '') + '</p>';
      if (at.mis && MIS[at.mis]) {
        h += '<div class="card tight" style="margin:12px 0 0;background:#1d2438">' +
             '<p class="small" style="margin:0 0 6px"><b>What happened:</b> ' +
             esc(MIS[at.mis].name) + '.</p>' +
             '<p class="small muted" style="margin:0">' + esc(MIS[at.mis].root) + '</p></div>';
      }
      if (it.worked && it.worked.length) {
        h += '<h3>Working</h3><ol class="steps small">' +
             it.worked.map(w => '<li>' + w + '</li>').join('') + '</ol>';
      }
      c.innerHTML = h;
      a.appendChild(c);
    });
  }
  const b = el('button', 'btn-primary', 'Send my progress to Javen');
  b.onclick = () => go('#/share');
  a.appendChild(b);
  renderNav();
}

/* ---------- practice ---------- */
let P = null;
function weakKcs() {
  return KCS.filter(k => tested(k.id) && !kcPassed(k.id))
            .sort((x, y) => (S.kc[x.id].pL - S.kc[y.id].pL));
}
function viewPractice() {
  const a = clear();
  a.appendChild(el('h1', '', 'Practice'));
  const weak = weakKcs();
  if (!weak.length) {
    a.appendChild(el('div', 'card', '<p>Nothing flagged as weak yet. Do the check-up first ' +
      'and this will fill up.</p>'));
    renderNav(); return;
  }
  a.appendChild(el('p', 'small muted', 'Pick something to drill. Full explanations here — ' +
    'this is the part where you’re meant to learn, not be measured.'));
  weak.forEach(k => {
    const pool = (ITEMS_BY_KC[k.id] || []);
    if (!pool.length) return;
    const pl = Math.round(100 * displayedProficiency(S.kc[k.id].pL, 0));
    const b = el('button', '',
      '<b>' + esc(k.name) + '</b><div class="meter"><i style="width:' + pl +
      '%;background:' + (pl < 40 ? '#f2607a' : pl < 70 ? '#f0a93f' : '#3ecf8e') +
      '"></i></div><div class="tiny muted" style="margin-top:5px">' + pool.length +
      ' questions available</div>');
    b.onclick = () => startPractice(k.id);
    a.appendChild(b);
  });
  renderNav();
}
function startPractice(kcId) {
  /* Order by review priority, so the ones she was CONFIDENT about and still got
     wrong come first. Those are the most correctable (being surprised by an
     error is what makes the correction stick) and the ones she would never
     think to practise, precisely because they did not feel wrong. Items she has
     never seen come next; everything else backfills. */
  const pool = ITEMS_BY_KC[kcId] || [];
  const seen = {}, last = {};
  S.attempts.forEach(x => { seen[x.id] = (seen[x.id] || 0) + 1; last[x.id] = x; });
  const score = it => {
    const a = last[it.id];
    if (!a) return 1.0;                       // unseen: worth doing, below a known error
    return 2.0 + reviewPriority(CONF_VALUE[a.conf] || 0.55, a.correct, a.correct ? 3 : 1);
  };
  const sorted = pool.slice().sort((x, y) =>
    (score(y) - score(x)) || ((seen[x.id] || 0) - (seen[y.id] || 0)));
  P = { kc: kcId, queue: sorted.slice(0, 5), i: 0 };
  practiceQuestion();
}
function practiceQuestion() {
  if (!P || P.i >= P.queue.length) { go('#/practice'); return; }
  const item = P.queue[P.i];
  Q = { entry: { kc: item.kc, depth: 0, anchor: item.kc }, item: item, t0: Date.now(),
        tFirst: 0, chosen: null, changes: 0, conf: 'shaky', chFromCorrect: false, hint: false };
  const a = clear();
  a.appendChild(el('div', 'small muted', KC_BY_ID[P.kc].name + ' · ' +
    (P.i + 1) + ' of ' + P.queue.length));
  const card = el('div', 'card'); card.appendChild(el('div', '', item.stem)); a.appendChild(card);
  const btns = [];
  item.options.forEach((o, i) => {
    const b = el('button', '',
      '<span class="opt"><span class="k">' + 'ABCD'[i] + '</span><span class="t">' +
      o.text + '</span></span>');
    b.onclick = () => {
      if (Q.chosen !== null) return;
      if (!Q.tFirst) Q.tFirst = Date.now() - Q.t0;
      Q.chosen = i;
      btns.forEach((x, j) => {
        if (item.options[j].correct) x.className = 'right';
        else if (j === i) x.className = 'wrong';
        x.onclick = null;
      });
      const at = {
        id: item.id, kc: item.kc, ts: Date.now(), correct: !!o.correct, chosen: i,
        mis: o.correct ? null : (o.mis || null), conf: 'shaky', msFirst: Q.tFirst,
        msTotal: Date.now() - Q.t0, changes: 0, chFromCorrect: false, hint: Q.hint,
      };
      record(at);
      const fb = el('div', 'card');
      let h = '';
      if (!o.correct && o.mis && MIS[o.mis]) {
        h += '<p class="small" style="margin:0 0 8px"><b>' + esc(MIS[o.mis].name) + '.</b> ' +
             esc(MIS[o.mis].root) + '</p>' +
             '<p class="small muted" style="margin:0 0 10px">' + esc(MIS[o.mis].fix) + '</p>';
      }
      if (item.worked && item.worked.length) {
        h += '<h3 style="margin-top:0">Working</h3><ol class="steps small">' +
             item.worked.map(w => '<li>' + w + '</li>').join('') + '</ol>';
      }
      fb.innerHTML = h;
      a.appendChild(fb);
      const nx = el('button', 'btn-primary', P.i + 1 >= P.queue.length ? 'Done' : 'Next');
      nx.onclick = () => { P.i++; practiceQuestion(); };
      a.appendChild(nx);
    };
    btns.push(b); a.appendChild(b);
  });
  renderNav();
}

/* ---------- share ---------- */
function viewShare() {
  const a = clear();
  a.appendChild(el('h1', '', 'Send to Javen'));
  const code = encodeShare();
  const base = (typeof location !== 'undefined' ? (location.origin + location.pathname) : '');
  const url = base + '#/tutor?d=' + code;
  a.appendChild(el('div', 'card',
    '<p>This sends Javen what you did — which questions, how long, how sure you were. ' +
    'It helps him plan the session so you’re not re-covering stuff you already know.</p>' +
    '<p class="small muted">Your answers stay between your phone and his. Nothing is stored ' +
    'on a website.</p>'));
  const b = el('button', 'btn-primary', 'Share the link');
  b.onclick = () => {
    if (typeof navigator !== 'undefined' && navigator.share) {
      navigator.share({ title: 'Precalc progress', text: 'My precalc check-up', url: url })
               .catch(() => {});
    } else if (typeof navigator !== 'undefined' && navigator.clipboard) {
      navigator.clipboard.writeText(url);
      b.textContent = 'Link copied ✓';
    }
  };
  a.appendChild(b);
  const ta = el('textarea'); ta.value = url; ta.readOnly = true;
  a.appendChild(el('h3', '', 'Or copy this'));
  a.appendChild(ta);
  renderNav();
}

/* ---------- tutor dashboard ---------- */
function viewTutor() {
  const a = clear();
  renderNav();
  const hash = (typeof location !== 'undefined' ? location.hash : '');
  const m = hash.match(/[?&]d=([A-Za-z0-9\-_]+)/);
  let imported = null;
  if (m) {
    try { imported = decodeShare(m[1]); } catch (e) { imported = { error: e.message }; }
  }
  if (imported && imported.error) {
    a.appendChild(el('div', 'card', '<p>Could not read that code: ' + esc(imported.error) + '</p>'));
    return;
  }
  if (imported) { S = imported.state; VIEWING_IMPORT = true; }
  else if (!sessionUnlocked()) { return renderGate(a); }

  const st = processStats();
  a.appendChild(el('h1', '', 'Tutor view — ' + esc(S.name)));
  if (!st) { a.appendChild(el('p', 'muted', 'No attempts in this record.')); return; }
  if (imported && imported.stale) {
    a.appendChild(el('div', 'card', '<p class="small">⚠️ This code came from a ' +
      'different build of the question bank. Item text may not line up.</p>'));
  }
  a.appendChild(el('p', 'muted small',
    st.n + ' questions · ' + st.correct + ' correct (' + st.pct + '%) · ' +
    st.totalMin + ' min · ' + new Date(S.created).toLocaleDateString()));

  /* --- the agenda: what to actually do --- */
  a.appendChild(el('h2', '', 'Session agenda'));
  const ag = agenda();
  if (!ag.length) a.appendChild(el('p', 'muted small', 'Nothing flagged.'));
  ag.forEach((g, i) => {
    const c = el('div', 'card flag');
    c.style.setProperty('--c', g.kind === 'calib' ? '#f2607a'
                              : g.kind === 'family' ? '#a97bf0' : '#f0a93f');
    let h = '<h2 style="margin-top:0">' + (i + 1) + '. ' + esc(g.title) + '</h2>' +
            '<p class="small">' + esc(g.why) + '</p>' +
            '<p class="small muted"><b>How:</b> ' + esc(g.how) + '</p>';
    if (g.probes && g.probes.length) {
      h += '<h3>Probes</h3><ul class="steps small">' +
           g.probes.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>';
    }
    c.innerHTML = h;
    a.appendChild(c);
  });

  /* --- calibration 2x2 --- */
  const cal = calibration();
  a.appendChild(el('h2', '', 'Confidence vs correctness'));
  a.appendChild(el('p', 'small muted', 'The top-right cell is the one a grade cannot show you.'));
  const g = el('div', 'grid2');
  [['Confident + right', cal.confRight.length, '#3ecf8e', 'Mastered. Stop spending time here.'],
   ['Confident + WRONG', cal.confWrong.length, '#f2607a', 'Misconception. She will resist correction.'],
   ['Unsure + right', cal.unsureRight.length, '#f0a93f', 'Fragile. Knows it, does not trust it.'],
   ['Unsure + wrong', cal.unsureWrong.length, '#8fa0bd', 'Clean gap. Nothing to unlearn.']]
    .forEach(([label, n, col, note]) => {
      const q = el('div', 'q2');
      q.innerHTML = '<div class="n" style="color:' + col + '">' + n + '</div>' +
                    '<div class="l"><b>' + esc(label) + '</b><br>' + esc(note) + '</div>';
      g.appendChild(q);
    });
  a.appendChild(g);

  /* --- error families --- */
  const fams = familyFindings();
  if (fams.length) {
    a.appendChild(el('h2', '', 'Error patterns'));
    fams.forEach(f => {
      const c = el('div', 'card');
      c.innerHTML = '<h2 style="margin-top:0">' + esc(f.name) + '</h2>' +
        '<p class="small muted">' + esc(f.summary) + '</p>' +
        '<p class="small"><b>' + f.count + ' error' + (f.count === 1 ? '' : 's') +
        '</b> across <b>' + f.spread + '</b> topic' + (f.spread === 1 ? '' : 's') + '.</p>' +
        f.misconceptions.map(mm =>
          '<div class="card tight" style="margin:9px 0 0;background:#1d2438">' +
          '<p class="small" style="margin:0 0 4px"><b>' + esc(mm.m.name) + '</b> ×' + mm.n +
          '</p><p class="tiny muted" style="margin:0 0 4px"><code>' + esc(mm.m.signature) +
          '</code></p><p class="tiny muted" style="margin:0">Probe: ' + esc(mm.m.probe) +
          '</p></div>').join('') +
        '<p class="small" style="margin-top:11px"><b>Fix:</b> ' + esc(f.fix) + '</p>';
      a.appendChild(c);
    });
  }

  /* --- root causes --- */
  const roots = rootCauses();
  if (roots.length) {
    a.appendChild(el('h2', '', 'Root causes'));
    a.appendChild(el('p', 'small muted',
      'Failed, with nothing broken beneath them. Everything above is downstream.'));
    roots.forEach(r => {
      const c = el('div', 'card tight');
      c.innerHTML = '<p style="margin:0 0 4px"><b>' + esc(r.name) + '</b> ' +
        '<span class="pill">' + (r.tier === 0 ? 'algebra substrate' : 'precalc') + '</span>' +
        '<span class="pill">' + r.evidence + ' item' + (r.evidence === 1 ? '' : 's') + '</span></p>' +
        '<p class="small muted" style="margin:0">' + esc(r.blurb) + '</p>' +
        (r.blockedFailing.length
          ? '<p class="tiny" style="margin:6px 0 0">Blocks: ' +
            esc(r.blockedFailing.map(b => KC_BY_ID[b].name).join(', ')) + '</p>' : '');
      a.appendChild(c);
    });
  }

  /* --- how she works --- */
  a.appendChild(el('h2', '', 'How she works'));
  const proc = el('div', 'card');
  proc.innerHTML =
    kv('Median time per question', st.medianSec + 's') +
    kv('Median reading time before first tap', st.medianReadSec + 's') +
    kv('Median time when right', st.medianRightSec + 's') +
    kv('Median time when wrong', st.medianWrongSec + 's') +
    kv('Fast misses (under 60% of median)', st.fastWrong +
       (st.fastWrong ? ' — pattern-matching, not reading' : '')) +
    kv('Slow misses (over 150% of median)', st.slowWrong +
       (st.slowWrong ? ' — method missing, not carelessness' : '')) +
    kv('Nudges opened', String(st.hints)) +
    kv('Answer changes', String(st.changes)) +
    kv('Changed right → wrong', st.changedToWrong +
       (st.changedToWrong ? ' — second-guessing costs her' : '')) +
    kv('Changed wrong → right', String(st.changedToRight));
  a.appendChild(proc);

  /* --- raw log --- */
  a.appendChild(el('h2', '', 'Every answer'));
  const tbl = el('table');
  tbl.innerHTML = '<tr><th>#</th><th>Topic</th><th>Sure?</th><th>Time</th><th>Result</th></tr>' +
    S.attempts.map((x, i) =>
      '<tr><td>' + (i + 1) + '</td><td>' + esc((KC_BY_ID[x.kc] || {}).name || x.kc) + '</td>' +
      '<td>' + esc(x.conf) + '</td><td>' + Math.round(x.msTotal / 1000) + 's</td>' +
      '<td>' + (x.correct ? '✅' : '❌' + (x.mis && MIS[x.mis]
        ? ' <span class="tiny muted">' + esc(MIS[x.mis].name) + '</span>' : '')) +
      '</td></tr>').join('');
  a.appendChild(tbl);

  const back = el('button', 'btn-ghost', 'Back');
  back.onclick = () => { VIEWING_IMPORT = false; load(); go('#/'); };
  a.appendChild(back);
}

function kv(k, v) {
  return '<div class="kv"><span class="small muted">' + esc(k) + '</span><b class="small">' +
         esc(v) + '</b></div>';
}

let _unlocked = false;
function sessionUnlocked() { return _unlocked; }
function renderGate(a) {
  a.appendChild(el('h1', '', 'Tutor view'));
  a.appendChild(el('p', 'muted small',
    'The student’s own results live under Results. This view is the clinical one.'));
  const inp = document.createElement('input');
  inp.type = 'password'; inp.placeholder = 'code';
  a.appendChild(inp);
  const b = el('button', 'btn-primary', 'Open');
  b.style.marginTop = '10px';
  b.onclick = () => {
    if (inp.value === TUTOR_CODE) { _unlocked = true; render(); }
    else { inp.value = ''; inp.placeholder = 'nope'; }
  };
  a.appendChild(b);
  const back = el('button', 'btn-ghost', 'Back');
  back.onclick = () => go('#/');
  a.appendChild(back);
}

/* ---------- router ---------- */
function render() {
  const h = (typeof location !== 'undefined' ? location.hash : route) || '#/';
  route = h.split('?')[0];
  if (route.indexOf('#/install') === 0) return viewInstall();
  // On an iPhone, offer the install BEFORE she answers anything: the installed
  // app cannot see answers given in Safari, so installing later loses them.
  if (route === '#/' && !S.name && !S.skipInstall && isIOS() && !isStandalone()) {
    return viewInstall();
  }
  if (route.indexOf('#/diagnostic') === 0) return viewDiagnostic();
  if (route.indexOf('#/results') === 0) return viewResults();
  if (route.indexOf('#/practice') === 0) return viewPractice();
  if (route.indexOf('#/share') === 0) return viewShare();
  if (h.indexOf('#/tutor') === 0) return viewTutor();
  return viewHome();
}

if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('hashchange', render);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
}
load();
render();
</script>
